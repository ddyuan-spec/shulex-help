function setRange(key,index,value){if(!value)return;const k=key==='page'?current.id:key,r=[...getRange(key)];r[index]=value;if(r[0]>r[1]){toast('开始日期不能晚于结束日期',false);render();return}state.ranges[k]=r;reloadData('日期筛选已更新')}

 return {rs,total:rs.length,replies:replies.reduce((s,x)=>s+x.replies,0),replyAvg:replies.length?(replies.reduce((s,x)=>s+x.replyMin,0)/replies.length).toFixed(2):'0.00',solved:solved.length,rate:rs.length?(100*solved.length/rs.length).toFixed(2):'0.00',ai:rs.filter(x=>x.id%4!==0).length,first:rs.length?(rs.reduce((s,x)=>s+x.replyMin*.4,0)/rs.length).toFixed(2):'0.00',good:rs.filter(x=>x.good).length,csat:rs.length?(rs.filter(x=>x.good).length/rs.length*100).toFixed(1):'0.0'}

function lineChart(series=null,labels=null,colorList=['#6d6bff','#65c8e8','#2abd79'],height=225){
 const base=series||dailySeries();const ss=Array.isArray(base[0])?base:[base,base.map((x,i)=>Math.round(x*(.5+(i%3)*.1))),base.map((x,i)=>Math.round(x*.25))];

const notes={
 '01':{title:'本次需求总说明',body:`<section class="note-section"><h4>01.1 功能交互</h4><div class="note-rule"><span class="rule-id">01.1.1</span><p><b>唯一入口</b>右上角选择时区；支持搜索和更多 IANA 时区。设置页、报表筛选区、导出弹窗不再增加选择器。</p></div><div class="note-rule"><span class="rule-id">01.1.2</span><p><b>切换生效</b>选择后保存并重新查询当前页；进入本期其他页面沿用同一选择。保留业务筛选，按新时区重算日期边界。详见 02。</p></div><div class="note-rule"><span class="rule-id">01.1.3</span><p><b>个人保存</b>按“当前用户 × GOFO 租户”保存，刷新、重新登录后复用；其他成员不变。未设置或值无效时默认 <b>(GMT+08:00) Asia/Shanghai</b>，不被浏览器时区覆盖。</p></div><div class="note-rule"><span class="rule-id">01.1.4</span><p><b>导出确认</b>已有导出带入页面的时区及筛选，弹窗只读展示；用户点击“确认下载”才生成文件。详见 07。</p></div></section><section class="note-section"><h4>01.2 影响范围</h4><div class="note-rule"><span class="rule-id">01.2.1</span><p><b>必做 · 总览</b>数据分析 → 工作台看板 → 总览：数据概览、今日概览、增长、绩效及已有导出按时区重算。详见 03。</p></div><div class="note-rule"><span class="rule-id">01.2.2</span><p><b>必做 · 工单报表</b>工作台看板 → 工单：现有 7 个子页的日期边界、统计分组、图表和明细联动。详见 04。</p></div><div class="note-rule"><span class="rule-id">01.2.3</span><p><b>必做 · 会话报表</b>工作台看板 → 会话：现有 5 个子页的日期边界、统计分组、评价及并发时段联动。详见 05。</p></div><div class="note-rule"><span class="rule-id">01.2.4</span><p><b>必做 · 创建时间</b>智能工作台 → 工单：创建时间列转换显示；创建日期筛选按所选时区换算查询边界。详见 06。</p></div><div class="note-rule optional"><span class="rule-id">01.2.5</span><p><b>连带可选做 · 最后消息</b>仅工单列表的最后消息列转换显示，已有导出含该字段时同步；不做时保留原口径，不阻断必做项验收。详见 10。</p></div></section><section class="note-section"><h4>01.3 本期边界</h4><div class="note-rule"><span class="rule-id">01.3.1</span><p><b>租户与灰度</b>仅 GOFO 且灰度开启时生效；其他租户沿用原有行为。默认东八，按个人保存；不增加团队时区设置。详见 08。</p></div><div class="note-rule"><span class="rule-id">01.3.2</span><p><b>模块边界</b>只覆盖上述四块；排班、电话、Agent 看板、坐席/队列监控、消息正文、物流来源时间、主动触达、每日额度均不在本期。详见 09。</p></div><div class="note-rule"><span class="rule-id">01.3.3</span><p><b>数据与执行</b>不修改原始时间戳和时长算法；SLA 只调整本期报表口径，不修改策略执行、提醒、营业日历或截止时间。</p></div><div class="note-rule"><span class="rule-id">01.3.4</span><p><b>版本边界</b>旧绩效小版及“本周不再提示”方案撤下；不新增时区设置页或下载中心。底部灰度、用户及可选项开关仅供原型验收。</p></div></section>`},
 '02':{title:'切换、日期边界与加载',body:`<section class="note-section"><h4>02.1 功能交互</h4><div class="note-rule"><span class="rule-id">02.1.1</span><p><b>选择与保存</b>在右上角点击选项后立即保存个人偏好并重查。保存失败保留旧选择并提示失败，不显示保存成功。</p></div><div class="note-rule"><span class="rule-id">02.1.2</span><p><b>保留筛选</b>保留渠道、团队、客服、粒度及绝对日期文案；今日、昨日、本周、最近 N 天等相对日期在新时区重新求值，周起始规则沿用系统。</p></div><div class="note-rule"><span class="rule-id">02.1.3</span><p><b>加载与失败</b>重查时覆盖旧结果并禁用导出；查询失败显示新时区错误态及重试，不能把旧数据标成新时区。连续切换仅接收最后一次响应。</p></div></section><section class="note-section"><h4>02.2 影响范围</h4><div class="note-rule"><span class="rule-id">02.2.1</span><p><b>日期边界</b>绝对日期保留 YYYY-MM-DD；用新时区开始日 00:00 至结束日次日 00:00 生成 <b>[开始，结束)</b> UTC 区间，按 IANA 规则处理夏令时。</p></div><div class="note-rule"><span class="rule-id">02.2.2</span><p><b>数据联动</b>本期各卡片、图表、明细与下钻重新查询或计算；缓存/请求键包含租户、时区、日期、业务筛选和粒度，个人权限数据还需用户或权限上下文。</p></div></section><section class="note-section"><h4>02.3 实现边界</h4><div class="note-rule"><span class="rule-id">02.3.1</span><p><b>跨模块</b>本次建议由主框架初始化偏好并向本期两个微前端传递同一 IANA 标识，正式持久化使用用户偏好服务；切换用户/租户先清理旧上下文再读取新偏好。</p></div><div class="note-rule"><span class="rule-id">02.3.2</span><p><b>交互复用与证据</b>复用已核验排班时区组件的搜索、滚动及选中样式，常用项不是支持上限。本地使用 localStorage 和合成 UTC 事件模拟，不代表真实接口已支持。</p></div></section>`},
 '03':{title:'总览：卡片、增长与绩效',body:`<section class="note-section"><h4>03.1 功能交互</h4><div class="note-rule"><span class="rule-id">03.1.1</span><p><b>切换响应</b>右上角切换后，数据概览、今日工单概览、增长、绩效统一重查；各卡片保留自己的日期和业务筛选，不互相覆盖。</p></div><div class="note-rule"><span class="rule-id">03.1.2</span><p><b>统计归属</b>创建指标按创建事件、回复按回复事件、解决按解决事件重新归属日期，重算汇总、环比、排名与图表；今日活动按新时区自然日计算。</p></div></section><section class="note-section"><h4>03.2 影响范围</h4><div class="note-rule"><span class="rule-id">03.2.1</span><p><b>必做</b>仅数据分析 → 工作台看板 → 总览，以及该页已有相关导出；不是其他看板入口。</p></div><div class="note-rule"><span class="rule-id">03.2.2</span><p><b>时长与状态</b>持续时长按事件时间差计算，不加 GMT 偏移；样本变化可改变均值/中位数/比率。当前待处理等状态快照不凭空变化，有“今日”限制的卡片按既有定义重查。</p></div></section><section class="note-section"><h4>03.3 实现边界</h4><div class="note-rule"><span class="rule-id">03.3.1</span><p><b>重算要求</b>已核验统计链路存在按上海日期聚合的处理；不能只换标签或平移已汇总日报，需支持新时区分组的数据层才能实现。代码快照不代表环境已部署。</p></div></section>`},
 '04':{title:'工单报表：现有 7 个子页',body:`<section class="note-section"><h4>04.1 功能交互</h4><div class="note-rule"><span class="rule-id">04.1.1</span><p><b>筛选与刷新</b>切换时区后保留各页及卡片筛选；头部日期、卡片日期、分页、排名、现有下钻统一传递所选时区并刷新。</p></div><div class="note-rule"><span class="rule-id">04.1.2</span><p><b>统计分组</b>小时/星期/日期/月按新时区重新分组；评价按评价事件、SLA 报表按对应达成/违约事件归属，沿用现有指标公式。</p></div></section><section class="note-section"><h4>04.2 影响范围</h4><div class="note-rule"><span class="rule-id">04.2.1</span><p><b>必做 · 7 个子页</b>工作台看板 → 工单：工单、效率、客服活动、客服更新、未解决工单、满意度、SLA。上述页面已有导出同时跟随。</p></div><div class="note-rule"><span class="rule-id">04.2.2</span><p><b>聚合规则</b>未解决总量及当前状态快照不变；按创建月份分组可改变边界记录。时长不加偏移，比例与中位数重新聚合，不对日均值再次求均值。</p></div></section><section class="note-section"><h4>04.3 本期边界</h4><div class="note-rule"><span class="rule-id">04.3.1</span><p><b>仅 SLA 报表</b>不修改 SLA 策略执行、排班、营业日历、提醒与截止时间。原型合成数据仅演示既有图表联动，不重新定义指标。</p></div></section>`},
 '05':{title:'会话报表：现有 5 个子页',body:`<section class="note-section"><h4>05.1 功能交互</h4><div class="note-rule"><span class="rule-id">05.1.1</span><p><b>筛选与刷新</b>切换时区后保留业务筛选，重新查询日期条件、小时/星期/日期分组、评价趋势、客服排名和并发时段。</p></div><div class="note-rule"><span class="rule-id">05.1.2</span><p><b>重算方法</b>并发峰值在新查询区间重新取最大值，不叠加小时峰值；完成率、满意度从分子分母重算，会话持续时长不加减时区偏移。</p></div></section><section class="note-section"><h4>05.2 影响范围</h4><div class="note-rule"><span class="rule-id">05.2.1</span><p><b>必做 · 5 个子页</b>工作台看板 → 会话：会话、效率、满意度、客服活动、客服并发。上述页面已有导出同时跟随。</p></div></section><section class="note-section"><h4>05.3 本期边界</h4><div class="note-rule"><span class="rule-id">05.3.1</span><p><b>限定报表模块</b>不扩展到会话工作台、消息正文时间、电话报表、Agent 看板、坐席与队列监控。</p></div></section>`},
 '06':{title:'智能工作台：创建时间与筛选（必做）',body:`<section class="note-section"><h4>06.1 功能交互</h4><div class="note-rule"><span class="rule-id">06.1.1</span><p><b>创建时间显示</b>同一 UTC 时间格式化为所选时区，切换后刷新列值；不修改原始时间戳、工单排序与记录本身。原型用既有“显示设置”打开该列。</p></div><div class="note-rule"><span class="rule-id">06.1.2</span><p><b>创建日期筛选</b>用户选择日期后，按所选时区自然日边界换算 UTC 查询；跨日时匹配行数可能改变。相对日期在所选时区求值。</p></div></section><section class="note-section"><h4>06.2 影响范围</h4><div class="note-rule"><span class="rule-id">06.2.1</span><p><b>必做 · 两处</b>智能工作台 → 工单列表的既有“创建时间”列及“创建日期”筛选；已有导出涉及该列/筛选时同步，见 07。</p></div><div class="note-rule optional"><span class="rule-id">06.2.2</span><p><b>连带可选做</b>最后消息列支持相同时区，单独见 10；不把可选项混入创建时间必做验收。</p></div></section><section class="note-section"><h4>06.3 本期边界</h4><div class="note-rule"><span class="rule-id">06.3.1</span><p><b>共用 helper</b>代码中创建时间与最后消息共用格式化 helper；若不做可选项，仅修改创建时间分支，避免其他字段被一起改变。消息正文、SLA 倒计时、物流面板纽约时间不在本期。</p></div><div class="note-rule"><span class="rule-id">06.3.2</span><p><b>历史视图</b>已有视图保存的绝对毫秒区间保留原值，不批量重写；用户重新选日期时生成新边界。保存/共享视图结构与规则时区本期不扩展。</p></div></section>`},
 '07':{title:'已有导出沿用页面口径',body:`<section class="note-section"><h4>07.1 功能交互</h4><div class="note-rule"><span class="rule-id">07.1.1</span><p><b>打开确认</b>点击已有导出入口，将点击时的时区、日期、业务筛选及权限带入确认弹窗；时区只读，不提供第二个选择器。</p></div><div class="note-rule"><span class="rule-id">07.1.2</span><p><b>确认与取消</b>点击“确认下载”才提交或生成文件；取消、关闭、等待均不触发。任务固定提交参数，后续切换页面时区不改变该任务。</p></div></section><section class="note-section"><h4>07.2 影响范围</h4><div class="note-rule"><span class="rule-id">07.2.1</span><p><b>必做 · 已有导出</b>仅本期报表与工单列表已经存在的导出。报表统计按同一时区重算；工单创建时间和创建日期沿用页面口径。</p></div><div class="note-rule optional"><span class="rule-id">07.2.2</span><p><b>连带可选做</b>已有导出含最后消息且本期实现可选项时同步转换；未做时沿用原口径，其他时间字段不扩展。</p></div></section><section class="note-section"><h4>07.3 本期边界</h4><div class="note-rule"><span class="rule-id">07.3.1</span><p><b>文件口径</b>文件元信息记录 IANA 时区、日期范围与生成时间；跨夏令时区间不能用单个固定偏移代表全部记录。</p></div><div class="note-rule"><span class="rule-id">07.3.2</span><p><b>撤下旧规则</b>不增加导出类型或下载中心；旧小版“默认按照筛选时区导出，本周不再提示”不再采用。</p></div></section>`},
 '08':{title:'GOFO 灰度、隔离与回退',body:`<section class="note-section"><h4>08.1 功能交互</h4><div class="note-rule"><span class="rule-id">08.1.1</span><p><b>启用</b>仅 GOFO 且灰度开启时展示右上角入口，并让本期页面读取个人时区；首次默认东八。</p></div><div class="note-rule"><span class="rule-id">08.1.2</span><p><b>关闭与恢复</b>关闭、未命中或状态不可用时禁用新能力：GOFO 本期统计回到默认东八，其他字段走原逻辑；保存的个人偏好可保留，关闭期间不生效。</p></div></section><section class="note-section"><h4>08.2 影响范围</h4><div class="note-rule"><span class="rule-id">08.2.1</span><p><b>租户隔离</b>前后端都校验 GOFO 及能力开关；其他租户无入口，不读取 GOFO 偏好、不携带新时区参数，保留原口径，不能强制改成东八。</p></div><div class="note-rule"><span class="rule-id">08.2.2</span><p><b>用户隔离</b>同一 GOFO 租户按当前用户独立保存；用户 A 切换不修改用户 B。跨本期页面和刷新继承同一偏好。</p></div></section><section class="note-section"><h4>08.3 灰度实施与验收</h4><div class="note-rule"><span class="rule-id">08.3.1</span><p><b>开关建议</b>复用灰度机制，新增独立能力（建议名 GOFO_TIMEZONE_V1），不复用 DMS 开关或含测试租户的既有白名单；名称是本次建议，非现有能力。</p></div><div class="note-rule"><span class="rule-id">08.3.2</span><p><b>上线顺序</b>本期查询/导出均支持后再开灰度；检查权限、时区字典、缓存隔离与导出，只配置 GOFO，观测错误与延迟，异常关闭回退。</p></div><div class="note-rule"><span class="rule-id">08.3.3</span><p><b>验收清单</b>默认东八；用户/租户隔离；刷新和跨模块继承；夏令时切换日 23/25 小时；连续切换仅最后响应；创建时间转换；关闭回退。最后消息按可选项实际交付状态单列验收。</p></div></section>`},
 '09':{title:'范围边界与代码依据',body:`<section class="note-section"><h4>09.1 功能交互</h4><div class="note-rule"><span class="rule-id">09.1.1</span><p><b>全局的含义</b>右上角共用入口只在本期页面生效；具体操作见 01/02，不代表系统所有业务一起改时区。</p></div></section><section class="note-section"><h4>09.2 影响范围</h4><div class="note-rule"><span class="rule-id">09.2.1</span><p><b>必做 · 四块</b>工作台看板总览、工单 7 子页、会话 5 子页；智能工作台工单创建时间与创建日期。已有导出跟随各页。最后消息仅连带可选做。</p></div><div class="note-rule"><span class="rule-id">09.2.2</span><p><b>不在本期</b>电话、Agent 看板、坐席/队列监控、消息正文、物流来源时间、排班、SLA 执行、主动触达、每日额度、团队时区、共享视图规则、设置内时区页、新下载中心。</p></div></section><section class="note-section"><h4>09.3 现有实现与建议分开</h4><div class="note-rule"><span class="rule-id">09.3.1</span><p><b>当次核查</b>2026-10-28 只读代码：shulex_base master @ fb1510fc40dd；plg-help-desk master @ a1bfa25e74bd；solvea-report master @ 57c72929bb02。完整提交和文件路径见随附代码核查记录。</p></div><div class="note-rule"><span class="rule-id">09.3.2</span><p><b>已核验快照</b>工作台看板实际位于 solvea-report 的 tarsReports 模块；现有统计参数缺少 IANA 时区。主框架个人资料未发现统一选择器；排班有独立时区组件。</p></div><div class="note-rule"><span class="rule-id">09.3.3</span><p><b>本次建议 / 尚未核验</b>跨微前端个人偏好、新时区参数及 GOFO 灰度为本次设计，不能当成已实现；代码存在不代表部署。本地为合成数据，真实服务重算和环境上线待核验。</p></div></section>`},
 '10':{title:'最后消息：连带可选做',body:`<section class="note-section"><h4>10.1 功能交互</h4><div class="note-rule"><span class="rule-id">10.1.1</span><p><b>实施时</b>将最后消息对应 UTC 时间格式化为当前用户所选时区，与创建时间共用右上角入口；不改原始时间、排序、工单数量或创建日期筛选。</p></div><div class="note-rule"><span class="rule-id">10.1.2</span><p><b>未实施时</b>最后消息保持原口径，创建时间仍正常跟随。验收清单记录是否交付，不阻断必做项验收。</p></div></section><section class="note-section"><h4>10.2 影响范围</h4><div class="note-rule optional"><span class="rule-id">10.2.1</span><p><b>连带可选做 · 列表字段</b>仅智能工作台 → 工单列表“最后消息”列；已有导出包含该字段时同步。与创建时间共用 helper，需要显式控制修改范围。</p></div></section><section class="note-section"><h4>10.3 本期边界</h4><div class="note-rule"><span class="rule-id">10.3.1</span><p><b>不扩展</b>不包含消息正文、聊天气泡、日志、SLA 执行或物流时间；下方开关仅演示两种交付状态，不是产品新增设置。</p></div></section><label class="note-demo"><input type="checkbox" id="demo-last" aria-label="演示最后消息可选做"> 演示最后消息跟随时区（可选做）</label>`}
};
function productOf(){return current.id==='tickets'?'智能工作台':'数据分析'}
function navLink(id,text,ic,active=false){return `<a href="#/${id}" class="${active?'active':''}">${icon(ic)}<span>${text}</span></a>`}
function outside(text,ic){return `<button class="placeholder-link out-nav" data-action="outside">${icon(ic)}${text}</button>`}
function sidebar(){return `<aside class="side"><button class="product-switch" data-action="products">${icon(productOf()==='数据分析'?'report':'box')}<span>${productOf()}</span><span class="hamb">≡</span></button><nav class="nav">${current.id==='tickets'?navLink('tickets','工单','ticket',true)+outside('联系人','users')+outside('报表','report')+outside('主动触达','chat')+outside('设置','gear'):outside('Agent看板','report')+navLink('analysis-overview','工作台看板','report',true)}</nav><div class="side-bottom"><div class="side-tools"><button class="iconbutton" data-action="language" title="语言">${icon('globe')}</button><button class="iconbutton" data-action="outside" title="帮助">${icon('ticket')}</button></div><button class="profile" data-action="profile"><span class="avatar">r</span><span class="name">${state.user==='user-a'?'rick.yuan':'demo.member'}</span><span class="chev">›</span></button></div></aside>`}
function subnav(){if(current.id==='tickets')return `<aside class="subside"><h3>工单 <span style="float:right;font-weight:400">＋</span></h3>${[['全部',2596],['AI处理中',1387],['人工介入',2],['待处理',555],['处理中',304],['已解决',346],['通知',0],['广告',4],['我的',0],['发送失败',0]].map(([l,n],i)=>`<div class="ticket-view ${i===0?'active':''}"><span>${l}</span><span>${n}</span></div>`).join('')}<p class="ticket-sidebar-heading">个人视图</p><div class="ticket-view">＋ 创建视图</div><p class="ticket-sidebar-heading">公共视图</p><div class="ticket-view">Email</div><div class="ticket-view">Messages</div></aside>`;return `<aside class="subside"><h3>报表</h3>${navLink('analysis-overview','总览','grid',current.id==='analysis-overview')}${navLink('support-main','工单','ticket',current.family==='support')}${navLink('chat-main','会话','chat',current.family==='chat')}${outside('电话','phone')}${outside('坐席与队列监控','users')}</aside>`}
function header(){return `<header class="top"><a href="#/analysis-overview" class="logo" aria-label="Solvea 工作台看板">${logo}</a><div class="top-title">${icon('panel')}<span>${current.id==='tickets'?'工单':'工作台看板'}</span></div><div class="top-right">${enabled()?`<div class="header-tz-group"><button class="timezone-trigger" data-action="timezone" aria-label="切换时区" aria-expanded="${state.popover==='timezone'}">${icon('globe')}<b>${zoneLabel(state.tz)}</b>${icon('down')}</button>${mark('01')}</div>`:''}<button class="notify iconbutton" data-action="notification" aria-label="消息通知">${icon('bell')}</button></div></header>`}
function reviewbar(){return `<footer class="reviewbar"><a href="#/scope"><b>交互原型 · GOFO 灰度版</b></a><span class="bar-description">合成数据</span><span class="review-current">${current.title}</span><span class="spacer"></span><label>演示租户 <select id="demo-tenant" aria-label="演示租户"><option ${state.tenant==='GOFO'?'selected':''}>GOFO</option><option ${state.tenant==='其他租户'?'selected':''}>其他租户</option></select></label><label>用户 <select id="demo-user" aria-label="演示用户"><option value="user-a" ${state.user==='user-a'?'selected':''}>A</option><option value="user-b" ${state.user==='user-b'?'selected':''}>B</option></select></label><label><input type="checkbox" id="demo-gray" aria-label="演示灰度开关" ${state.gray?'checked':''}>灰度</label><a href="#/scope">影响范围 / 跳转</a><button data-note="08">灰度说明</button><button data-note="all">开发批注</button><button data-action="reset">重置演示</button></footer>`}
function render(){document.title=`${current.title} · GOFO 时区灰度原型`;let content=current.kind==='scope'?renderScope():current.kind==='overview'?renderOverview():current.kind==='dashboard'?renderDashboard():renderTickets();$('#app').innerHTML=`${header()}${sidebar()}${subnav()}<main class="main has-sub"><div class="canvas ${current.kind==='dashboard'?'white-canvas':''}" style="position:relative">${content}${state.busy?'<div class="busy-layer" role="status"><span class="spinner"></span>正在按所选时区重新查询…</div>':''}</div></main>${reviewbar()}`;$$('[data-export]').forEach(b=>b.disabled=state.busy);renderFloating()}
function renderScope(){return `<section class="scope-lead"><span class="tag purple">本期 · 仅 GOFO 灰度</span><h1 style="margin-top:17px">一个时区入口，四块影响范围</h1><p>右上角选择 → 当前用户在 GOFO 下保存 → 以下页面统一使用。默认 <b>(GMT+08:00) Asia/Shanghai</b>。不新增设置页，不按团队修改其他成员。</p><div class="scope-diagram"><div class="scope-node"><b>右上角唯一入口 ${mark('01')}</b>搜索 IANA 时区<br>个人偏好 × GOFO 租户</div><span class="scope-arrow">→</span><div class="scope-node"><b>工作台看板 ${mark('02')}</b>总览 / 工单 / 会话<br>日期边界、统计分组重新计算</div><span class="scope-arrow">＋</span><div class="scope-node"><b>智能工作台工单 ${mark('06')}</b>创建时间 / 创建日期（必做）<br>最后消息支持时区（可选做）</div></div></section><div class="gray-strip">${mark('08')} 仅 GOFO 且灰度开启时展示入口。非 GOFO 维持各页面原有行为。底部租户、用户和灰度开关仅用于原型验收，不是产品新增控件。</div><section class="panel"><div class="panel-head"><h2>本期页面与原型跳转</h2>${mark('09')}</div>${table(['影响板块','本期变化','进入原型'],[['工作台看板 · 总览','各卡片、日期统计、增长、绩效与现有导出联动',`<a class="link" href="#/analysis-overview">总览 →</a> ${mark('03')}`],['工作台看板 · 工单','既有 7 个子页的指标、小时/日期分组与明细联动',`<div class="scope-links">${supportPages.map(([k,t])=>`<a href="#/support-${k}">${t}</a>`).join('')}</div>${mark('04')}`],['工作台看板 · 会话','既有 5 个子页的统计、评价与并发时段联动',`<div class="scope-links">${chatPages.map(([k,t])=>`<a href="#/chat-${k}">${t}</a>`).join('')}</div>${mark('05')}`],['智能工作台 · 工单','创建时间列与创建日期筛选（必做）；最后消息列支持时区（连带可选做）',`<a class="link" href="#/tickets">工单列表 →</a> ${mark('06')}`]],'scope-table')}</section><section class="panel"><h3>范围边界</h3><p class="context-help">电话、Agent 看板、坐席与队列监控、消息正文时间、排班与 SLA 执行、GOFO 物流来源时间、主动触达及团队设置均不在本期。已有导出跟随当前页面时区，不新增第二个入口。绩效报表小版已撤下，本页替代其独立方案。</p><button data-note="all">查看全部开发批注</button></section>`}
function legacyDisplayZone(){return Intl.DateTimeFormat().resolvedOptions().timeZone||DEFAULT}
function renderTickets(){const displayZone=enabled()?state.tz:legacyDisplayZone();let rs=records(displayZone,getRange('tickets')).filter(x=>!state.query||(x.subject+' '+x.id).toLowerCase().includes(state.query.toLowerCase())).sort((a,b)=>b.at-a.at);return `<section class="ticket-canvas"><div class="ticket-tools"><input type="search" id="ticket-search" aria-label="搜索工单" placeholder="搜索工单号、主题、内容" value="${esc(state.query)}"><button data-action="ticket-search">搜索</button><span class="spacer"></span><button data-action="display-settings">${icon('panel')} 显示设置</button>${exportButton('工单列表','tickets')} ${mark('06')}</div><div class="ticket-filters">${['售后邮箱','处理人','状态','渠道'].map(l=>`<button class="chip" data-action="filters">${l} ${icon('down')}</button>`).join('')}<button class="chip" data-action="ticket-date">${icon('calendar')} 创建日期 ${icon('down')}</button><button class="link" data-action="filters">＋ 添加筛选</button></div><div class="ticket-count">创建日期：${getRange('tickets').join(' 至 ')}　${enabled()?zoneLabel(state.tz):'原有展示与筛选口径'}　匹配 ${rs.length} 条</div>${table(['<input type="checkbox" aria-label="全选工单">','主题','SLA','工单号','状态','最后消息 '+mark('10')+'<small class="optional-label">连带可选做</small>',...(state.showCreate?['创建时间 '+mark('06')]:[]),'标签','备注'],rs.slice(0,12).map((x,i)=>['<input type="checkbox" aria-label="选择工单">',`<span class="ticket-subject">${esc(x.subject)}</span><small class="ticket-contact">demo.customer · ${x.channel}</small>`,'--',`#${x.id}`,`<span class="tag gray">${x.status}</span>`,fmtTime(x.replyAt,enabled()&&state.includeLast?state.tz:legacyDisplayZone()).slice(0,16),...(state.showCreate?[`<time class="ticket-time">${fmtTime(x.at,displayZone)}</time>`]:[]),'--','--']), 'ticket-table')}<div class="pagination">共 ${rs.length} 条 · 演示前 12 条<button disabled>上一页</button><button>1</button><button disabled>下一页</button></div></section>`}
function zoneOptions(query=''){const full=state.showAllZones||query.trim(),list=full?matchingZones(query):commonZones.map(z=>zone(z.id));return `<div class="tz-list-heading">${query?'搜索结果':full?'全部时区':'常用时区'}</div><div class="tz-global-scroll">${list.map(z=>`<button class="tz-option ${z.id===state.tz?'active':''}" role="option" aria-selected="${z.id===state.tz}" data-tz="${z.id}"><span class="checkmark">${z.id===state.tz?'✓':''}</span><span class="zone-name"><b>${zoneLabel(z.id)}</b>${z.id===DEFAULT?'<small>默认 · 东八区</small>':''}</span></button>`).join('')||'<div class="empty">没有匹配的时区</div>'}</div>${!full?`<button class="tz-more" data-action="more-timezones">更多时区 · 共 ${zones.length} 项 ${icon('down')}</button>`:`<div class="tz-list-meta">${list.length} 个结果 · 按地区规则处理夏令时</div>`}`}
function noteModal(){const id=state.note==='all'?state.noteTab:state.note,n=notes[id];return `<div class="overlay"><section class="modal note-modal" role="dialog" aria-modal="true" aria-label="开发批注"><div class="modal-head"><div><h2>开发批注 · ${id} ${n.title}</h2><p>GOFO 灰度版 · 2026-10-28 · 页面角标、目录与文档编号一致</p></div><button class="iconbutton" data-action="close-note" aria-label="关闭批注">${icon('close')}</button></div><div class="note-layout"><nav class="note-index" aria-label="批注目录">${Object.entries(notes).sort((a,b)=>+a[0]-b[0]).map(([k,v])=>`<button data-note-tab="${k}" class="${id===k?'selected':''}" ${id===k?'aria-current="page"':''}><span>${k}</span>${v.title}</button>`).join('')}</nav><div class="modal-body note-content"><article><h3>${id} ${n.title}</h3><div class="note-guide">${id==='01'?'先看本次交互、影响范围与边界；细节按编号查阅。':'功能交互与影响范围分块说明；本期总说明见 01。'}</div>${n.body}</article></div></div><div class="modal-footer"><span class="context-help">紫色编号为开发说明，不是产品控件</span><button data-action="close-note">关闭</button></div></section></div>`}
function renderFloating(){let html='';if(state.popover==='timezone'&&enabled())html=`<section class="popover" role="dialog" aria-label="选择时区"><h3>时区 ${mark('02')}</h3><p>仅保存当前用户在 GOFO 下的选择，应用于本期看板及指定工单时间字段。</p><input class="tz-search" id="tz-search" aria-label="搜索城市或时区" placeholder="搜索地区、城市或 IANA 时区…"><div id="tz-options" role="listbox">${zoneOptions()}</div><div class="tz-foot">默认：(GMT+08:00) Asia/Shanghai<br>GMT 偏移为示例日期当前偏移，实际按每条记录日期处理。</div></section>`;
 if(state.popover==='products'||state.popover==='profile')html=`<section class="popover product-popover" style="${state.popover==='profile'?'top:auto;bottom:100px':''}"><h3>${state.popover==='profile'?'当前用户':'我们的产品'}</h3><a href="#/analysis-overview">${icon('report')} 数据分析</a><a href="#/tickets">${icon('ticket')} 智能工作台</a></section>`;
 if(state.popover==='filters')html=`<section class="popover" role="dialog" aria-label="业务筛选"><h3>渠道筛选</h3><p>保留现有业务筛选交互，时区仅在右上角选择。</p><select id="channel-filter" class="fieldselect" aria-label="筛选渠道">${['全部渠道',...channels].map(c=>`<option ${c===state.channel?'selected':''}>${c}</option>`).join('')}</select><button class="primary" data-action="apply-filters">应用</button></section>`;
 if(state.popover==='display-settings')html=`<section class="popover" role="dialog" aria-label="显示设置"><h3>显示设置</h3><p>复用已有可选列。</p><label><input type="checkbox" id="show-create" aria-label="显示创建时间列" ${state.showCreate?'checked':''}> 创建时间</label></section>`;
 if(state.popover==='ticket-date')html=`<div class="overlay"><section class="modal ticket-date-dialog" role="dialog" aria-label="创建日期筛选"><div class="modal-head"><div><h2>创建日期 ${mark('06')}</h2><p>${enabled()?zoneLabel(state.tz):'沿用原有口径'}</p></div><button class="iconbutton" data-action="close-popover" aria-label="关闭日期筛选">${icon('close')}</button></div><div class="modal-body"><div class="date-range"><input type="date" id="ticket-start" aria-label="创建开始日期" value="${getRange('tickets')[0]}"><span>—</span><input type="date" id="ticket-end" aria-label="创建结束日期" value="${getRange('tickets')[1]}"></div><p class="context-help">按所选日期的 00:00 至结束日次日 00:00 查询。</p></div><div class="modal-footer"><button data-action="close-popover">取消</button><button class="primary" data-action="apply-ticket-date">确定</button></div></section></div>`;
 if(state.export)html+=exportModal();if(state.note)html+=noteModal();$('#floating').innerHTML=html;const trigger=$('[data-action="timezone"]');if(trigger)trigger.setAttribute('aria-expanded',String(state.popover==='timezone'));const opt=$('#demo-last');if(opt)opt.checked=state.includeLast}
let toastTimer,refreshTimer;
function toast(message,success=true){clearTimeout(toastTimer);$('#toast-slot').innerHTML=`<div class="toast" role="status"><span class="${success?'success':''}">${success?'✓':'ⓘ'}</span>${esc(message)}</div>`;toastTimer=setTimeout(()=>$('#toast-slot').innerHTML='',4200)}
function reloadData(message=''){state.popover=null;state.busy=true;render();clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>{state.busy=false;render();if(message)toast(message)},450)}
function setTimezone(id){if(!enabled()||!zones.some(z=>z.id===id))return;if(id===state.tz){state.popover=null;render();return}try{localStorage.setItem(prefKey(),JSON.stringify(id))}catch{toast('保存失败，请重试',false);return}state.tz=id;reloadData('时区已保存，当前页面已重新计算')}
function nextDate(d){return new Date(Date.parse(d+'T12:00:00Z')+86400000).toISOString().slice(0,10)}
function startExport(type,key='page'){if(state.busy)return;state.popover=null;state.export={type,key,range:[...getRange(key)],tz:current.id==='tickets'&&!enabled()?legacyDisplayZone():state.tz,channel:state.channel,dimension:state.dimension,includeLast:enabled()&&state.includeLast,query:state.query,pending:false};if(type.includes('绩效')){const table=$('#performance-block table');state.export.snapshot={headers:[...table.querySelectorAll('thead th')].map(x=>x.textContent.trim()),rows:[...table.querySelectorAll('tbody tr')].map(tr=>[...tr.querySelectorAll('td')].map(td=>td.textContent.trim()))}}renderFloating()}
function exportModal(){const e=state.export;return `<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="导出确认"><div class="modal-head"><div><h2>导出${esc(e.type)} ${mark('07')}</h2><p>确认后生成文件，时区沿用当前页面。</p></div><button class="iconbutton" data-action="close-export" aria-label="关闭导出弹窗" ${e.pending?'disabled':''}>${icon('close')}</button></div><div class="modal-body"><div class="summary-box"><div class="summary-line"><span>导出日期</span><strong>${e.range.join(' 至 ')}</strong></div><div class="summary-line"><span>导出时区</span><strong>${zoneLabel(e.tz)}</strong></div><div class="summary-line"><span>渠道</span><strong>${esc(e.channel)}</strong></div><div class="summary-line"><span>文件格式</span><strong>Excel（.xlsx）</strong></div></div><div class="notice neutral">如需其他时区，请取消并在右上角切换；已提交的文件保持提交时的口径。</div></div><div class="modal-footer"><button data-action="close-export" ${e.pending?'disabled':''}>取消</button><button class="primary" data-action="confirm-export" ${e.pending?'disabled':''}>${e.pending?'正在生成…':'确认下载'}</button></div></section></div>`}
async function finishExport(){const e=state.export;if(!e||e.pending)return;e.pending=true;renderFloating();const rs=records(e.tz,e.range,e.type.includes('绩效')?'replyAt':'at').filter(x=>e.type!=='工单列表'||!e.query||(x.subject+' '+x.id).toLowerCase().includes(e.query.toLowerCase()));let snapshot;if(e.snapshot)snapshot=e.snapshot;else if(e.type.includes('绩效'))snapshot={headers:['客服','回复消息数量','平均回复时长 (Min)','已解决工单量'],rows:staff.map(name=>{const group=rs.filter(r=>r.agent===name);return [name,group.reduce((s,r)=>s+r.replies,0),group.length?(group.reduce((s,r)=>s+r.replyMin,0)/group.length).toFixed(2):'--',Math.floor(group.length/4)]})};else if(e.type.includes('增长'))snapshot={headers:['日期','时区','工单量'],rows:daysInRange(e.range).map(d=>[d,e.tz,rs.filter(x=>fmtDate(x.at,e.tz)===d).length])};else snapshot={headers:['工单号','主题','创建时间 ('+e.tz+')','最后消息 ('+(e.includeLast?e.tz:'原口径')+')','状态'],rows:rs.map(x=>[x.id,x.subject,fmtTime(x.at,e.tz),fmtTime(x.replyAt,e.includeLast?e.tz:legacyDisplayZone()),x.status])};const task={...e,snapshot,rows:rs.length,createdAt:new Date().toISOString(),filename:`${e.type}_${e.range.join('_')}_${e.tz.replaceAll('/','-')}.xlsx`};try{downloadWorkbook(task);state.export=null;renderFloating();toast('文件已按当前页面时区生成')}catch{e.pending=false;renderFloating();toast('生成失败，请重试',false)}}
function changeContext(){clearTimeout(refreshTimer);state.busy=false;state.export=null;state.popover=null;state.note=null;state.channel='全部渠道';state.ranges={};state.query='';persist('solvea-gofo-prototype-context-v1',{tenant:state.tenant,user:state.user,gray:state.gray});restoreZone();render();toast(enabled()?'已载入该用户在 GOFO 下的时区':'灰度未命中：新入口已隐藏，展示原有行为')}
document.addEventListener('click',event=>{const el=event.target.closest('button,a');if(!el){if(state.popover&&!event.target.closest('.popover,.modal')){state.popover=null;renderFloating()}return}if(el.dataset.note){state.note=el.dataset.note;state.noteTab=el.dataset.note==='all'?'01':el.dataset.note;renderFloating();return}if(el.dataset.noteTab){state.noteTab=el.dataset.noteTab;state.note='all';renderFloating();return}if(el.dataset.tz){setTimezone(el.dataset.tz);return}if(el.dataset.export){startExport(el.dataset.export,el.dataset.key);return}if(el.dataset.scroll){document.getElementById(el.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'});return}if(el.dataset.seg){state.granularity[el.dataset.seg]=+el.dataset.value;const top=$('.main').scrollTop;render();$('.main').scrollTop=top;return}const a=el.dataset.action;if(['timezone','products','profile','filters','display-settings','ticket-date'].includes(a)){state.showAllZones=false;state.popover=state.popover===a?null:a;renderFloating();return}if(a==='more-timezones'){state.showAllZones=true;$('#tz-options').innerHTML=zoneOptions($('#tz-search').value);return}if(a==='apply-filters'){state.channel=$('#channel-filter').value;reloadData('筛选已应用');return}if(a==='close-note'){state.note=null;renderFloating();return}if(a==='close-popover'){state.popover=null;renderFloating();return}if(a==='close-export'){if(!state.export?.pending){state.export=null;renderFloating()}return}if(a==='confirm-export'){finishExport();return}if(a==='apply-ticket-date'){const r=[$('#ticket-start').value,$('#ticket-end').value];if(!r[0]||!r[1]||r[0]>r[1]){toast('请选择有效日期范围',false);return}state.ranges.tickets=r;reloadData('已按创建日期重新查询');return}if(a==='ticket-search'){state.query=$('#ticket-search').value;render();return}if(a==='table-search'){const section=el.closest('.chart-panel'),q=section?.querySelector('input')?.value.trim().toLowerCase()||'';section?.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q));return}if(a==='outside'){toast('此入口不在本期影响范围，维持现有功能',false);return}if(a==='language'){toast('现有语言入口，本期不调整');return}if(a==='notification'){toast('暂无新消息');return}if(a==='reset'){state.tenant='GOFO';state.user='user-a';state.gray=true;for(const u of ['user-a','user-b'])localStorage.removeItem('solvea-gofo-timezone-v1:GOFO:'+u);state.dimension='客服人员';state.granularity={};changeContext();return}if(el.matches('a[href^="#/"]'))return});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='demo-last'){state.includeLast=el.checked;render();return}if(el.dataset.range){setRange(el.dataset.range,+el.dataset.index,el.value);return}if(el.id==='demo-tenant'){state.tenant=el.value;changeContext();return}if(el.id==='demo-user'){state.user=el.value;changeContext();return}if(el.id==='demo-gray'){state.gray=el.checked;changeContext();return}if(el.id==='show-create'){state.showCreate=el.checked;state.popover=null;render();return}if(el.id==='performance-dimension'){state.dimension=el.value==='按客服组'?'客服组':'客服人员';const top=$('.main').scrollTop;render();$('.main').scrollTop=top;return}});
document.addEventListener('input',event=>{if(event.target.id==='tz-search')$('#tz-options').innerHTML=zoneOptions(event.target.value)});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(state.note)state.note=null;else if(state.export&&!state.export.pending)state.export=null;else state.popover=null;renderFloating()}});
window.addEventListener('hashchange',route);route();

</script>
