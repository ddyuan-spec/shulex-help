function renderService(){const m=model(),daily=+(state.granularity['service-grain']??0)===1,r=getRange();const ds=daysInRange(r);let buckets=[];if(daily)buckets=ds.map(d=>({label:d,start:d,end:d}));else {let lastKey='';for(const d of ds){const t=Date.parse(d+'T12:00:00Z'),day=(new Date(t).getUTCDay()+6)%7,key=new Date(t-day*86400000).toISOString().slice(0,10);if(key!==lastKey){buckets.push({start:d,end:d});lastKey=key}else buckets.at(-1).end=d}buckets.forEach((b,i)=>b.label=`第 ${i+1} 周 (${shortDate(b.start)}–${shortDate(b.end)})`)}const tableRows=buckets.map(b=>{const n=records(state.tz,[b.start,b.end]).length;return [b.label,...[n,Math.floor(n*.95),Math.floor(n*.7)].map(v=>`<button class="count-link" data-drill="${b.start}|${b.end}">${v}</button>`),'70.3%','70.3%','80.3%','80.3%']});return `<div class="page-head"><div><button class="link" data-go="agent-overview" style="margin-bottom:14px">${icon('back')} 返回</button><h1>服务能力</h1>${tzNote()}</div></div><nav class="tabs">${['ticket','message','handoff'].map((k,i)=>`<a href="#/agent-service-${k}" class="${current.tab===k?'active':''}">${['工单详情','消息详情','转人工详情'][i]}</a>`).join('')}</nav><div class="toolbar" style="margin:24px 0">${daterange()}<select aria-label="Bot"><option>Bot</option><option>Solvea</option></select><select aria-label="渠道"><option>渠道</option>${channels.map(c=>`<option>${c}</option>`).join('')}</select><span style="margin-left:auto;color:#8c96a4;font-size:11px">展示粒度</span>${seg(['按周','按日'],'service-grain')}</div><h2 style="font-size:16px;margin-bottom:22px">${{ticket:'工单详情',message:'消息详情',handoff:'转人工详情'}[current.tab]}</h2><div class="metrics outlined">${metric('总工单量',m.total)}${metric('AI 进线工单量',m.ai)}${metric('解决工单量',Math.floor(m.total*.7))}${metric('进线解决率','70.3%')}</div><div class="section-h"><h2>指标趋势</h2></div>${chartPanel('总量与 AI 服务表现',lineChart())}<div class="section-h"><h2>日 / 周明细</h2><span class="muted" style="font-size:11px">点击数量查看工单，时区自动继承</span></div>${table([daily?'日期':'周区间','总工单量','AI 进线工单量','AI 解决工单量','全量解决率','进线解决率','全量工单回复率','进线工单回复率'],tableRows)}`}

function renderOutreach(){return `<div class="page-head"><div><h1>主动触达</h1><p>配置触达时机、发送渠道，以及每次结果如何记录。</p><div class="timezone-note">${icon('globe')}时间显示：${zone(state.tz).name} · ${offsetAt(state.tz)}</div></div><button data-action="outreach-note">${icon('plus')} 新建定向触达</button></div><section class="panel"><div class="panel-head"><div><h2 style="font-size:16px;margin:0 0 8px">定向触达</h2><p class="muted" style="font-size:12px;margin:0">按条件筛选工单并发送跟进邮件。</p></div>${seg(['全部 136','运行中 0','待启用 21','已暂停 50','已完成 65'],'outreach-status')}</div><div class="toolbar" style="margin-bottom:20px"><input class="scope-search" placeholder="搜索定向触达计划" aria-label="搜索计划"><select><option>受众来源</option></select><select><option>触达渠道</option></select><select><option>最近更新时间</option></select></div>${table(['计划名称','来源','渠道','状态','下次执行','操作'],['QA-COVER-1027-ACTIONS','QA-COVER-1027-STOP','QA-JSON-CAS-20261027-HUMAN','QA-JSON-CAS-20261027-AI'].map((n,i)=>[`${n}<div class="help">v 1 · ${i%2?'单次执行':'每15分钟'}</div>`,'工单条件','邮件',`<span class="outreach-status">${['已暂停','待启用','已完成','已暂停'][i]}</span>`,i===1?'启动后执行':i===2?'已执行':`${fmtTime('2026-10-27T04:27:47Z')}<div class="help">${zone(state.tz).short}</div>`,`<button class="link" data-action="outreach-records">执行记录</button>`]))}</section>`}
function renderDownloads(){const ds=state.downloads;return `<div class="page-head"><div><h1>下载中心</h1><p>每个导出任务保留提交时的时区和筛选条件，便于区分不同团队的数据。</p></div><button data-go="bot-overview">返回绩效报表 ${icon('arrow')}</button></div><div class="guide-note">当前页面时区：<b>${zone(state.tz).name}</b>。这里的任务时区以提交时为准；切换全局时区不会改变已生成文件的数据口径。</div><section class="panel" style="padding:5px 15px">${ds.length?table(['报表 / 文件','统计范围','导出时区','创建时间','状态','操作'],ds.map(d=>[`<strong style="font-weight:500">${esc(d.type)}</strong><div class="help">${esc(d.filename)}</div>`,`${d.range.join(' 至 ')}<div class="help">${d.rows} 条记录</div>`,`<div class="downloads-tz">${zone(d.tz).name}<small>${esc(d.tz)} · ${offsetAt(d.tz)}</small></div>`,fmtTime(d.createdAt),'<span class="tag green">已完成</span>',`<button class="link" data-redownload="${d.id}">${icon('export')} 下载</button>`])):`<div class="empty">${icon('export')}<p>暂无导出文件</p><button class="primary" data-go="bot-overview">前往绩效报表导出</button></div>`}</section>`}
</script>
<script>
let toastTimer,refreshTimer;
function toast(message,success=true){clearTimeout(toastTimer);$('#toast-slot').innerHTML=`<div class="toast" role="status"><span class="${success?'success':''}">${success?'✓':'ⓘ'}</span>${esc(message)}</div>`;toastTimer=setTimeout(()=>$('#toast-slot').innerHTML='',4200)}
function reloadData(message=''){state.popover=null;state.busy=true;render();clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>{state.busy=false;render();if(message)toast(message)},520)}
function setTimezone(id){state.settingsTz=null;if(!zones.some(z=>z.id===id))return;const changed=id!==state.tz;state.tz=id;state.popover=null;persist('solvea-prototype-tz',id);if(changed)reloadData(`已切换为${zone(id).name}，日期范围保持不变`);else render()}
function exportModal(){const e=state.export,z=zone(e.tz),different=e.tz!==e.pageTz,nondefault=e.tz!==DEFAULT;const count=records(e.tz,e.range,e.type.includes('绩效')?'replyAt':'at').length;return `<div class="overlay" data-overlay="export"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="export-title"><div class="modal-head"><div><h2 id="export-title">导出${esc(e.type)}</h2><p>请确认本次导出范围和时区，点击下方确认按钮后才会生成文件。</p></div><button class="iconbutton" data-action="close-modal" aria-label="关闭导出弹窗" ${e.pending?'disabled':''}>${icon('close')}</button></div><div class="modal-body"><div class="summary-box"><div class="summary-line"><span>统计日期</span><strong>${e.range.join(' 至 ')}</strong></div><div class="summary-line"><span>页面时区</span><strong>${zone(e.pageTz).name} · ${offsetAt(e.pageTz)}</strong></div><div class="summary-line"><span>筛选条件</span><strong>${state.channel==='全部渠道'?'全部渠道':esc(state.channel)}${e.type.includes('绩效')?' · 按'+state.dimension:''}</strong></div><div class="summary-line"><span>文件格式</span><strong>Excel（.xlsx）</strong></div></div><label class="field-label" for="export-timezone">本次导出时区</label>${zoneSelect("export",e.tz,"本次导出时区",e.pending)}<p class="help">仅用于本次导出，不改变页面或个人设置。选择时区不会自动导出。</p><div class="time-window"><div>按 <b>${z.name}</b> 的自然日重新统计</div><div>${e.range[0]} 00:00 至 ${nextDate(e.range[1])} 00:00（不含）</div><div style="margin-top:3px;color:#a1aabc">当前范围匹配 ${count} 条记录</div></div>${different?`<div class="notice">${icon('info')}<span>本次导出时区与页面不同，汇总和明细将按${z.name}重新计算，可能与当前页面数量不同。</span></div>`:nondefault?`<div class="notice neutral">${icon('info')}<span>本次按${z.name}导出，系统默认时区为北京时间。</span></div>`:''}</div><div class="modal-footer"><button data-action="close-modal" ${e.pending?'disabled':''}>取消</button><button type="button" class="primary" id="confirm-export" data-action="confirm-export" ${e.pending?'disabled':''}>${e.pending?'<span class="spinner"></span> 正在生成…':`确认并按${z.name}导出`}</button></div></section></div>`}
function renderFloating(){
 state.zonePicker=null;let html='';
 if(state.popover==='timezone')html=`<section class="popover" role="dialog" aria-label="选择全局时区"><h3>报表与显示时区</h3><p>仅影响你的报表、明细和时间显示，跨产品共用。</p><input class="tz-search" id="tz-search" placeholder="搜索城市或时区…" aria-label="搜索城市或时区"><div id="tz-options">${zoneOptions()}</div><div class="tz-foot"><span>系统默认：北京时间</span><a href="#/timezone-settings" class="link">管理时区</a></div></section>`;
 else if(state.popover==='products'||state.popover==='profile')html=`<section class="popover product-popover" style="${state.popover==='profile'?'top:auto;bottom:88px':''}"><h3 style="font-size:12px;color:#98a0ad;padding-left:8px">${state.popover==='profile'?'rick.yuan':'我们的产品'}</h3>${[['agent-overview','智能客服','品牌服务的专业数字员工','box'],['bot-overview','智能工作台','智能化的工单系统','box'],['analysis-overview','数据分析','Agent与工作台数据报表','report']].map(([id,t,d,ic])=>`<a href="#/${id}">${icon(ic)}<div>${t}<small>${d}</small></div></a>`).join('')}<div style="border-top:1px solid #edf0f5;margin-top:8px;padding-top:6px"><a href="#/timezone-settings">${icon('globe')}时间与时区</a><a href="#/downloads">${icon('export')}下载中心</a><a href="#/scope">${icon('panel')}影响页面清单</a></div></section>`;
 else if(state.popover==='filters')html=`<section class="popover" style="top:160px;right:40px" role="dialog" aria-label="业务筛选"><h3>业务筛选</h3><p>时区在全局顶栏统一选择。</p><label class="field-label" for="channel-filter">渠道</label><select class="fieldselect" id="channel-filter" style="width:100%;max-width:none;height:36px">${['全部渠道',...channels].map(c=>`<option ${c===state.channel?'selected':''}>${c}</option>`).join('')}</select><div style="display:flex;justify-content:flex-end;margin-top:20px"><button class="primary" data-action="apply-filters">应用筛选</button></div></section>`;
 else if(state.popover==='date-type')html=`<section class="popover" style="top:168px;right:40px;width:230px"><h3>日期筛选</h3><button class="tz-option" data-datetype="created">创建日期</button><button class="tz-option" data-datetype="satisfaction">满意度提交时间</button><div class="tz-foot">按${zone(state.tz).name}解释日期范围</div></section>`;
 if(state.drawer)html+=drawerHTML();
 if(state.export)html+=exportModal();
 $('#floating').innerHTML=html;
}

function timezoneAnnotation(){return '<div class="prototype-annotation"><b>原型标注 · 时区组件复用</b><p>复用现有“设置 → 排班 → 时区”的输入搜索、滚动列表、GMT 偏移与选中标记；本次增加常用项、更多时区、中文名称及别名搜索。报表、导出、团队与排班应共用时区字典，各自保留选择。</p><p>正式范围：完整 IANA 地区时区库，按日期处理夏令时并持续更新；不以常用项为支持上限。原型当前提供 '+zones.length+' 个可选地区与 UTC，来源为浏览器时区集合并补充常用标识。</p><a href="https://ai-staging.solvea.cx/botdesk#/settings/business-calendar" target="_blank" rel="noopener">现有系统交互来源 ↗</a><a href="https://www.iana.org/time-zones" target="_blank" rel="noopener">时区库标准 ↗</a></div>'}
function zoneOptions(query=''){
 const full=state.showAllZones||query.trim(),list=full?matchingZones(query):commonZones.map(z=>zone(z.id));
 return '<div class="tz-list-heading">'+(query?'搜索结果':full?'全部时区':'常用时区')+'</div><div class="tz-global-scroll">'+(list.map(z=>'<button class="tz-option '+(z.id===state.tz?'active':'')+'" data-tz="'+esc(z.id)+'"><span class="checkmark">'+(z.id===state.tz?'✓':'')+'</span><span class="zone-name"><b>'+esc(z.name)+(z.id===DEFAULT?'<span class="default-marker">默认</span>':'')+'</b><small>'+esc(z.id)+'</small></span><span class="offset">'+offsetAt(z.id)+'</span></button>').join('')||'<div class="empty" style="padding:20px">没有匹配的时区</div>')+'</div>'+(!full?'<button class="tz-more" data-action="more-timezones">更多时区 · 搜索全部 '+zones.length+' 项 '+icon('down')+'</button>':'<div class="tz-list-meta">'+list.length+' 个结果 · 按地区时区规则转换</div>');
}
function pickerSelected(context){return context==='export'?state.export.tz:state.settingsTz||state.tz}
function zoneSelect(context,id,label,disabled=false){return '<div class="zone-select" data-zone-context="'+context+'"><div class="zone-select-trigger"><input id="'+context+'-timezone" role="combobox" aria-label="'+label+'" aria-expanded="false" aria-autocomplete="list" aria-controls="'+context+'-zone-list" autocomplete="off" data-zone-input="'+context+'" value="'+esc(zoneLabel(id))+'" '+(disabled?'disabled':'')+'><span class="zone-select-arrow">'+icon('down')+'</span></div><div class="zone-dropdown" hidden><div class="zone-select-options" id="'+context+'-zone-list" role="listbox" aria-label="'+label+'选项"></div></div></div>'}
function selectOptions(context,query='',all=false){
 const selected=pickerSelected(context),full=all||query.trim(),ids=new Set(commonZones.map(z=>z.id));ids.add(selected);
 const list=full?matchingZones(query):zones.filter(z=>ids.has(z.id));
 return '<div class="tz-list-heading">'+(query?'搜索结果':full?'全部时区':'常用时区')+'</div><div class="zone-select-scroll">'+(list.map(z=>'<button type="button" class="zone-select-option" role="option" aria-selected="'+(z.id===selected)+'" data-zone-pick="'+esc(z.id)+'" data-zone-for="'+context+'"><span><b>'+esc('('+offsetAt(z.id).replace('UTC','GMT')+') '+z.id)+'</b><small>'+esc(z.name)+(z.id===DEFAULT?' · 默认':'')+'</small></span><span class="zone-selected-check">'+(z.id===selected?'✓':'')+'</span></button>').join('')||'<div class="empty" style="padding:20px">没有匹配的时区</div>')+'</div>'+(!full?'<button type="button" class="tz-more" data-zone-more="'+context+'">更多时区（全部 '+zones.length+' 项）'+icon('down')+'</button>':'<div class="tz-list-meta">'+list.length+' 个结果 · 可搜索城市、中文或地区标识</div>');
}
function closeZonePicker(){if(!state.zonePicker)return;const c=state.zonePicker.context,wrap=$('[data-zone-context="'+c+'"]');if(wrap){const input=wrap.querySelector('input');input.value=zoneLabel(pickerSelected(c));input.setAttribute('aria-expanded','false');wrap.querySelector('.zone-dropdown').hidden=true}state.zonePicker=null}
function openZonePicker(context){if(state.zonePicker?.context===context)return;closeZonePicker();state.zonePicker={context,all:false};const wrap=$('[data-zone-context="'+context+'"]'),input=wrap.querySelector('input');input.value='';input.placeholder=zoneLabel(pickerSelected(context));input.setAttribute('aria-expanded','true');wrap.querySelector('.zone-dropdown').hidden=false;wrap.querySelector('.zone-select-options').innerHTML=selectOptions(context);const menu=wrap.querySelector('.zone-dropdown');if(input.getBoundingClientRect().bottom+menu.offsetHeight>window.innerHeight-35){menu.style.top='auto';menu.style.bottom='calc(100% + 5px)'}else{menu.style.top='calc(100% + 5px)';menu.style.bottom='auto'}input.focus()}

function drawerHTML(){const type=state.drawer;let title='',body='';if(type==='queue'){title='当前等待工单';body=`<p class="muted" style="font-size:12px;line-height:1.8">等待截止时间按${zone(state.tz).name}显示。</p>${table(['排队位置','工单','工作通道','等待时长','等待截止时间'],[[1,'#1587','消息','00:19:30',fmtTime('2026-10-27T07:47:00Z')],[2,'#1586','邮件','00:23:18',fmtTime('2026-10-27T08:05:00Z')]])}`}
 else if(type==='outreach'){title='QA-COVER-1027-ACTIONS';body=`<p class="muted" style="font-size:12px">工单条件 · 每15分钟 · 邮件</p><p class="inline-note">时间显示：${zone(state.tz).name} · ${offsetAt(state.tz)}</p>${table(['计划时间','结果','状态'],['2026-10-27T04:12:47Z','2026-10-27T04:07:32Z','2026-10-27T03:57:28Z','2026-10-27T03:52:32Z'].map((t,i)=>[fmtTime(t),`${i===3?1:0} 已发送 / ${i===3?0:1} 排除 / 0 失败`,'已完成']))}<div class="rule-note">这些记录的时间随显示时区转换；每批发送结果及计划执行时机保持不变。</div>`}
 else {title='执行日志';body=`<p class="inline-note">时间显示：${zone(state.tz).name}</p><div class="timeline">${['收到客户消息','识别问题意图','检索知识库','生成并发送回复'].map((x,i)=>`<div class="timeline-item">${x}<time>${fmtTime(nowDemo-(4-i)*60000)} · ${zone(state.tz).short}</time></div>`).join('')}</div>`}
 return `<aside class="details-panel" role="dialog" aria-label="${title}"><button class="iconbutton drawer-close" data-action="close-drawer" aria-label="关闭详情">${icon('close')}</button><h2>${title}</h2>${body}</aside>`;
}
function nextDate(d){return new Date(Date.parse(d+'T12:00:00Z')+86400000).toISOString().slice(0,10)}
function startExport(type,key='page'){
 if(state.busy){toast('数据更新中，请稍后导出',false);return}
 const range=[...getRange(key)];if(!range[0]||!range[1]||range[0]>range[1]){toast('请先选择有效的统计日期',false);return}

function rawPerformance(tz,range,dimension='客服人员'){
 if(dimension==='客服组'){const m=model(tz,range);return {headers:['客服组','回复消息数量','平均回复时长 (Min)','已解决工单量','平均解决时长 (h)'],rows:[['Email Team',Math.round(m.replies*.6),'116.25',12,'16.72'],['Message Team',Math.round(m.replies*.4),'42.81',8,'5.26']]}}
 const rows=staff.map((name,i)=>{const rs=records(tz,range,'replyAt').filter(r=>r.agent===name),n=rs.reduce((s,r)=>s+r.replies,0),avg=rs.length?(rs.reduce((s,r)=>s+r.replyMin,0)/rs.length).toFixed(2):'--';return [name,n,avg,rs.length?(avg*.4).toFixed(2):'--',Math.floor(rs.length/4),(rs.length*1.37).toFixed(2),i===0?1:0,i===0?'1.75%':'0.00%']});
 return {headers:['指标','回复消息数量','平均回复时长 (Min)','平均首次回复时长 (Min)','已解决工单量','平均解决时长 (h)','超过24h回复的消息数量','超时回复率'],rows:[['Solvea',Math.round(model(tz,range).replies*.68),'12','12.55',2,'58.05',0,'--'],...rows]};
}
function snapshotExport(e){const r=records(e.tz,e.range,e.type.includes('绩效')?'replyAt':'at');if(e.type.includes('绩效'))return rawPerformance(e.tz,e.range,state.dimension);if(e.type.includes('满意度'))return {headers:['工单ID','满意度提交时间 ('+zone(e.tz).name+')','评价','渠道','客服'],rows:records(e.tz,e.range,'satisfactionAt').map(x=>[x.id,fmtTime(x.satisfactionAt,e.tz),x.good?'好评':'差评',x.channel,x.agent])};if(e.type.includes('增长'))return {headers:['日期','时区','工单量'],rows:daysInRange(e.range).map(d=>[d,e.tz,r.filter(x=>fmtDate(x.at,e.tz)===d).length])};return {headers:['工单ID','创建时间 ('+zone(e.tz).name+')','回复时间 ('+zone(e.tz).name+')','渠道','客服','状态','回复消息数','回复时长 (Min)'],rows:r.map(x=>[x.id,fmtTime(x.at,e.tz),fmtTime(x.replyAt,e.tz),x.channel,x.agent,x.status,x.replies,x.replyMin])}}
async function finishExport(){
 const e=state.export;if(!e||e.pending)return;e.pending=true;renderFloating();
 const selection={...e,range:[...e.range],channel:state.channel,dimension:state.dimension};const snapshot=snapshotExport(selection);const createdAt=new Date().toISOString();
 const task={id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),type:e.type,tz:e.tz,range:[...e.range],createdAt,channel:selection.channel,dimension:selection.dimension,rows:records(e.tz,e.range,e.type.includes('绩效')?'replyAt':'at').length,snapshot,filename:`${e.type.replace(/[\\/:*?"<>|]/g,'-')}_${e.range[0]}_${e.range[1]}_${e.tz.replaceAll('/','-')}.xlsx`};
 await new Promise(resolve=>setTimeout(resolve,500));
 try{downloadWorkbook(task);state.downloads.unshift(task);state.downloads=state.downloads.slice(0,40);persist('solvea-prototype-downloads',state.downloads);state.export=null;renderFloating();if(current.kind==='downloads')render();toast(`已按${zone(task.tz).name}导出，记录已保存至下载中心`)}catch(err){e.pending=false;renderFloating();toast('文件生成失败，请重新尝试',false);console.error(err)}
}

function colName(i){let s='';for(i++;i;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s}

function zipStore(files){
 const encoder=new TextEncoder();const table=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let j=0;j<8;j++)c=c&1?0xedb88320^(c>>>1):c>>>1;table[n]=c>>>0}

 const chunks=[],central=[];let offset=0;const make=(len,fields)=>{const a=new Uint8Array(len),v=new DataView(a.buffer);fields.forEach(([pos,val,size])=>size===4?v.setUint32(pos,val,true):v.setUint16(pos,val,true));return a};
 for(const [name,str] of Object.entries(files)){const filename=encoder.encode(name),data=encoder.encode(str),checksum=crc(data),local=make(30,[[0,0x04034b50,4],[4,20,2],[6,0x800,2],[8,0,2],[14,checksum,4],[18,data.length,4],[22,data.length,4],[26,filename.length,2]]);chunks.push(local,filename,data);const cd=make(46,[[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x800,2],[10,0,2],[16,checksum,4],[20,data.length,4],[24,data.length,4],[28,filename.length,2],[42,offset,4]]);central.push(cd,filename);offset+=local.length+filename.length+data.length}
 const size=central.reduce((n,a)=>n+a.length,0),end=make(22,[[0,0x06054b50,4],[8,Object.keys(files).length,2],[10,Object.keys(files).length,2],[12,size,4],[16,offset,4]]);return new Blob([...chunks,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

 const files={
 '[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>',

 'xl/_rels/workbook.xml.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
 'xl/styles.xml':'<?xml version="1.0" encoding="UTF-8"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Microsoft YaHei"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Microsoft YaHei"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF142131"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>',

document.addEventListener('click',event=>{

 const wrap=event.target.closest('.zone-select'),zoneInput=event.target.closest('[data-zone-input]');
 if(zoneInput&&!zoneInput.disabled){openZonePicker(zoneInput.dataset.zoneInput);return}
 if(event.target.closest('.zone-select-arrow')){const input=wrap.querySelector('input');if(!input.disabled)openZonePicker(input.dataset.zoneInput);return}
 if(state.zonePicker&&!wrap)closeZonePicker();
 const el=event.target.closest('button,a,[data-ticket]');
 if(el?.dataset.zoneMore){const c=el.dataset.zoneMore;state.zonePicker={context:c,all:true};$('#'+c+'-zone-list').innerHTML=selectOptions(c,'',true);$('[data-zone-input="'+c+'"]').focus();return}
 if(el?.dataset.zonePick){const c=el.dataset.zoneFor,id=el.dataset.zonePick;closeZonePicker();if(c==='export'){state.export.tz=id;renderFloating()}else{state.settingsTz=id;$('[data-zone-input="settings"]').value=zoneLabel(id)}return}

 if(event.target.classList.contains('overlay')&&state.export)return;
 if(!el){if(state.popover&&!event.target.closest('.popover')){state.popover=null;renderFloating()}return}
 if(el.matches('a[href^="#/"]')){state.popover=null;state.drawer=null;return}
 if(el.dataset.go){go(el.dataset.go);return}
 if(el.dataset.tz){setTimezone(el.dataset.tz);return}
 if(el.dataset.export){startExport(el.dataset.export,el.dataset.key||'page');return}
 if(el.dataset.scroll){document.getElementById(el.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(el.dataset.seg){state.granularity[el.dataset.seg]=+el.dataset.value;const scroll=$('.main').scrollTop;render();$('.main').scrollTop=scroll;return}
 if(el.dataset.agentTrend){const buttons=$$('[data-agent-trend]');buttons.forEach(b=>b.classList.toggle('active',b===el));return}
 if(el.dataset.drill){const range=el.dataset.drill.split('|');state.ranges.inbox=range;state.drill={label:'总工单量',from:current.id};state.ticket=0;go('inbox');return}
 if(el.dataset.redownload){const task=state.downloads.find(d=>d.id===el.dataset.redownload);if(task){downloadWorkbook(task);toast('已下载原任务文件，时区仍为'+zone(task.tz).name)}return}
 if(el.dataset.ticket!==undefined){state.ticket=+el.dataset.ticket;render();return}
 if(el.dataset.datetype){state.dateType=el.dataset.datetype;state.popover=null;render();const label=$('#date-type-label');if(label)label.textContent=state.dateType==='satisfaction'?'满意度提交时间':'创建日期';return}
 const action=el.dataset.action;
 if(action==='more-timezones'){state.showAllZones=true;$('#tz-options').innerHTML=zoneOptions($('#tz-search').value);return}
 if(action==='timezone')state.showAllZones=false;
 if(action==='timezone'||action==='products'||action==='profile'||action==='filters'||action==='date-type'){state.popover=state.popover===action?null:action;renderFloating();return}
 if(action==='apply-filters'){state.channel=$('#channel-filter').value;reloadData('筛选已应用');return}
 if(action==='close-modal'){if(!state.export?.pending){state.export=null;renderFloating()}return}
 if(action==='confirm-export'){finishExport();return}
 if(action==='ticket-export'){startExport($('#ticket-export').value.replace(/^导出/,''));return}
 if(action==='save-settings'){const target=state.settingsTz||state.tz;state.settingsTz=null;const same=target===state.tz;setTimezone(target);if(same)toast('设置已保存');return}
 if(action==='default-tz'){setTimezone(DEFAULT);toast('已恢复北京时间');return}
 if(action==='refresh-monitor'){reloadData('实时监控已刷新');return}
 if(action==='queue-detail'){state.drawer='queue';renderFloating();return}
 if(action==='outreach-records'){state.drawer='outreach';renderFloating();return}
 if(action==='inbox-log'){state.drawer='log';renderFloating();return}
 if(action==='close-drawer'){state.drawer=null;renderFloating();return}
 if(action==='notification'){toast('暂无新的消息通知');return}
 if(action==='table-search'){const section=el.closest('.chart-panel'),q=section?.querySelector('input')?.value.trim().toLowerCase()||'';section?.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q));return}
 if(action==='outreach-note'){toast('本原型演示执行记录的时间显示；计划仍按自身配置执行');return}
 if(action==='reset'){state.tz=DEFAULT;state.channel='全部渠道';state.ranges={};state.granularity={};state.downloads=[];state.export=null;state.popover=null;state.scopeQuery='';state.scopeFilter='全部页面';state.dimension='客服人员';state.dateType='created';state.drill=null;persist('solvea-prototype-tz',DEFAULT);persist('solvea-prototype-downloads',[]);render();toast('已重置体验，默认北京时间');return}
 if(state.popover&&!el.closest('.popover')){state.popover=null;renderFloating()}
});
document.addEventListener('change',event=>{
 const el=event.target;


 if(el.id==='scope-filter'){state.scopeFilter=el.value;$('#scope-table').innerHTML=scopeTable();return}
 if(el.dataset.range){setRange(el.dataset.range,+el.dataset.index,el.value);return}
 if(el.id==='performance-dimension'){state.dimension=el.value==='按客服组'?'客服组':'客服人员';const scroll=$('.main').scrollTop;render();$('.main').scrollTop=scroll;return}
});
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.zoneInput){const c=el.dataset.zoneInput,query=el.value;if(!state.zonePicker)openZonePicker(c);el.value=query;$('#'+c+'-zone-list').innerHTML=selectOptions(c,query,state.zonePicker?.all);return}if(el.id==='scope-search'){state.scopeQuery=el.value;$('#scope-table').innerHTML=scopeTable()}if(el.id==='tz-search')$('#tz-options').innerHTML=zoneOptions(el.value)});
document.addEventListener('keydown',event=>{if(state.zonePicker){const c=state.zonePicker.context;if(event.key==='Escape'){event.preventDefault();event.stopPropagation();closeZonePicker();$('[data-zone-input="'+c+'"]').focus();return}if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();const opts=Array.from($('#'+c+'-zone-list').querySelectorAll('[role="option"]')),i=opts.indexOf(document.activeElement),next=event.key==='ArrowDown'?Math.min(i+1,opts.length-1):Math.max(i-1,0);opts[next]?.focus();return}if(event.key==='Enter'&&event.target.dataset.zoneInput){event.preventDefault();return}}if(event.key==='Escape'){if(state.export&&!state.export.pending)state.export=null;else if(state.drawer)state.drawer=null;else state.popover=null;renderFloating()}});
window.addEventListener('hashchange',route);
route();
