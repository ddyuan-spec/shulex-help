 '<div class="tablewrap"><table><thead><tr><th>源工单</th><th>结果</th></tr></thead><tbody>'+f.results.map(r=>'<tr><td>#'+r.id+'</td><td class="'+(r.ok?'result-ok':r.pending?'':'result-bad')+'">'+esc(r.text)+'</td></tr>').join('')+'</tbody></table></div>'+
 '<div class="actions footer">'+(pending?button('reconcile','核对结果'):'')+(failed&&!pending?button('retry','仅重试失败项'):'')+button('ticket','查看目标工单','primary','data-id="'+f.target+'"')+'</div>';
}
function render(){
 el('filters').hidden=viewsHidden;document.querySelector('.frame').classList.toggle('menu-collapsed',viewsHidden);
 el('filters').innerHTML='<h2>工单</h2>'+[['all','▣ 全部'],['ai_handing','♙ AI处理中'],['open','▰ 待处理'],['pending','▤ 处理中'],['solved','✓ 已解决'],['Email','✉ Email']].map(([key,title])=>{
 const n=ids.filter(id=>!targetOf(id)&&(key==='all'||state(id)===key||items[id].channel===key)).length;
 return button('filter',title+' <span class="counter">'+n+'</span>',key===filter?'active':'','data-key="'+key+'"');
 }).join('');
 for(const id of names){el(id).hidden=id!==view;if(id!==view)el(id).replaceChildren()}
 const content={'desk-list':()=>layout==='table'?tableDesk():'<div class="listonly">'+list()+'<div class="guide">选择工单查看详情</div></div>','desk-detail':detail,'merge-select':selectPage,'merge-review':reviewPage,'merge-result':resultPage};
 el(view).innerHTML=content[view]()+(['desk-list','desk-detail'].includes(view)?layouts():'');
}
function start(kind){
 const bulk=kind==='bulk';
 flow={kind,origin:view,target:bulk?0:current,sources:bulk?[...checked]:[],matches:bulk?ids.filter(id=>!checked.has(id)&&!targetOf(id)):[],input:'',error:'',attempt:0,results:[]};
 menu=false;go('merge-select');
}
function log(id,text){(data.logs[id]??=[]).push({time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),text})}
function commit(){
 const f=flow, target=f.target;
 f.attempt++;
 const prior=f.results.filter(r=>r.ok);
 const plan=f.sources.map((id,i)=>{
  if(targetOf(id)===target)return {id,ok:true,text:'已并入 #'+target};
  const reason=reject(id,'source')||reject(target,'target');
  if(reason)return {id,ok:false,text:reason};
  if(scenario==='permission'&&i===f.sources.length-1)return {id,ok:false,text:'合并权限已变化，请确认权限'};
  if(scenario==='partial'&&f.attempt===1&&i===f.sources.length-1)return {id,ok:false,text:'暂未合并，可重试'};
  data.relation[id]={target,at:new Date().toISOString()};checked.delete(id);
  log(id,'合并工单：已并入 #'+target);log(target,'合并工单：#'+id+' 并入当前工单');
  return {id,ok:true,text:'已并入 #'+target};
 });
 save();f.actual=[...prior,...plan];
 f.results=scenario==='timeout'&&f.attempt===1?f.actual.map(({id})=>({id,pending:true,text:'提交超时，等待核对'})):f.actual;
 go('merge-result');
}
function incoming(){
 const target=targetOf(101);
 if(!target){notice='先将 #101 并入目标工单，再选择此演示场景。';view='desk-detail';current=100;render();return}
 (data.replies[target]??=[]).push({incoming:true,thread:101,body:'更新一下：我刚收到包裹了，谢谢。'});
 if(['pending','solved'].includes(state(target)))data.statuses[target]='open';
 log(target,'客户回复：原线程 #101 的来信进入当前工单');save();ticketOpen(target);
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;
 const id=Number(b.dataset.id);
 switch(b.dataset.action){
  case 'ticket':ticketOpen(id);break;
  case 'return-list':menu=false;go('desk-list');break;
  case 'filter':filter=b.dataset.key;query='';checked.clear();listPopover='';go('desk-list');break;
  case 'layout-card':
  case 'layout-table':layout=b.dataset.action==='layout-card'?'card':'table';query='';checked.clear();listPopover='';searchOpen=false;emailFilter=agentFilter=statusFilter=channelFilter='';go('desk-list');break;
  case 'left-menu':viewsHidden=!viewsHidden;render();break;
  case 'search-toggle':searchOpen=!searchOpen;listPopover='';if(!searchOpen)query='';render();if(searchOpen)el('list-search').querySelector('input').focus();break;
  case 'sort-menu':listPopover=listPopover==='sort'?'':'sort';render();break;
  case 'sort-last':sortBy='last';listPopover='';render();break;
  case 'sort-sla':sortBy='sla';listPopover='';render();break;
  case 'settings':listPopover=listPopover==='settings'?'':'settings';render();break;
  case 'clear-selection':checked.clear();render();break;
  case 'clear':query='';checked.clear();render();break;
  case 'menu':menu=!menu;render();el('desk-detail').querySelector(menu?'[data-action="detail-merge"]':'[data-action="menu"]')?.focus();break;
  case 'header-events':
  case 'header-more':{const key=b.dataset.action==='header-more'?'more':'events';headerPanel=headerPanel===key?'':key;menu=false;render();break}
  case 'detail-merge':if(!targetOf(current))start('detail');break;
  case 'bulk':start('bulk');break;
  case 'cancel':{const origin=flow.origin;flow=null;go(origin);break}
  case 'back':go('merge-select');break;
  case 'unpick':flow.sources=flow.sources.filter(x=>x!==id);render();break;
  case 'preview':go('merge-review');break;
  case 'commit':commit();break;
  case 'reconcile':flow.results=flow.actual;render();break;
  case 'retry':flow.sources=flow.results.filter(x=>!x.ok&&!x.pending).map(x=>x.id);go('merge-review');break;
  case 'reply-source':replyId=id;notice='';render();el('send-form').elements.body.focus();break;
  case 'reply-target':replyId=0;notice='';render();el('send-form').elements.body.focus();break;
 }
});
document.addEventListener('change',e=>{
 const x=e.target;
 if(x.dataset.listFilter){({mail:v=>emailFilter=v,agent:v=>agentFilter=v,status:v=>statusFilter=v,channel:v=>channelFilter=v})[x.dataset.listFilter](x.value);checked.clear();render();return}
 if(x.dataset.column){const columns=layout==='table'?visibleTable:visibleCard;x.checked?columns.add(x.dataset.column):columns.delete(x.dataset.column);render();return}
 if(x.id==='scenario'){scenario=x.value;if(scenario==='incoming'){incoming();scenario='normal';x.value='normal'}return}
 if(x.id==='select-all'){for(const id of listIds().filter(canSelect))x.checked?checked.add(id):checked.delete(id);render();el('select-all')?.focus();return}
 if(x.dataset.select){const id=Number(x.dataset.select);x.checked?checked.add(id):checked.delete(id);render();document.querySelector('[data-select="'+id+'"]')?.focus();return}
 if(x.dataset.candidate){
  const id=Number(x.dataset.candidate);
  if(flow.kind==='bulk')flow.target=id;
  else flow.sources=x.checked?[...new Set([...flow.sources,id])]:flow.sources.filter(x=>x!==id);
  render();document.querySelector('[data-candidate="'+id+'"]')?.focus();
 }
});
document.addEventListener('submit',e=>{
 const form=e.target;e.preventDefault();
 if(form.id==='list-search'){query=form.querySelector('input').value;checked.clear();render();return}
 if(form.id==='find-form'){
  const f=flow;f.input=form.querySelector('input').value.trim();
  const parts=[...new Set(f.input.split(/[\s,，、;；]+/).filter(Boolean).map(x=>x.replace(/^#/,'')))];
  const bad=parts.filter(x=>!/^\d+$/.test(x)||!items[Number(x)]);
  f.matches=parts.filter(x=>/^\d+$/.test(x)&&items[Number(x)]).map(Number);
  f.error=!parts.length?'请输入工单号。':bad.length?'部分工单不存在或无查看权限。':'';
  render();return;
 }
 if(form.id==='send-form'){
  const body=form.elements.body.value.trim();if(!body||targetOf(current))return;
  if(replyId&&scenario==='thread'){notice='无法从原邮箱发信：当前账号无发信权限。';render();el('send-form').elements.body.value=body;return}
  const thread=replyId||current;
  (data.replies[current]??=[]).push({thread,mail:items[thread].mail,body});
  data.statuses[current]=e.submitter?.value==='solved'?'solved':'pending';
  save();replyId=0;notice='已模拟发送';render();
 }
});
function seedMerged(){
 for(const id of [101,102]){data.relation[id]={target:100,at:'2026-11-12T18:00:00Z'};log(id,'合并工单：已并入 #100');log(100,'合并工单：#'+id+' 并入当前工单')}
}
function initScene(){
 if(['detail','merged','ai'].includes(reviewScene)){view='desk-detail';current=reviewScene==='ai'?103:100}
 if(reviewScene==='detail')menu=true;
 if(reviewScene==='batch'){layout='table';checked=new Set([101,102])}
 if(['confirm','result'].includes(reviewScene)){
  layout='table';checked=new Set([101,102]);flow={kind:'bulk',origin:'desk-list',target:100,sources:[101,102],matches:[100,103],input:'',error:'',attempt:0,results:[]};view='merge-review';
  if(reviewScene==='result'){commit();return}
 }
 if(reviewScene==='merged'||reviewScene==='source'){
  seedMerged();
  if(reviewScene==='source'){view='desk-detail';current=101}
 }
 if(reviewScene==='select'){
  view='desk-detail';current=100;start('detail');return;
 }
 render();
}
if(embedded)document.querySelector('.preview a').hidden=true;
el('reset').addEventListener('click',()=>{data=empty();save();scenario='normal';el('scenario').value='normal';checked.clear();flow=null;replyId=0;query='';filter='all';current=100;notice='';menu=false;layout='card';viewsHidden=false;searchOpen=false;listPopover='';headerPanel='';sortBy='last';emailFilter=agentFilter=statusFilter=channelFilter='';visibleTable=new Set(tableCols.map(([key])=>key));visibleCard=new Set(cardCols.map(([key])=>key).filter(key=>key!=='agent'));view='desk-list';initScene()});
initScene();
</script>
