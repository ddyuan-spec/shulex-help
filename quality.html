/* Configurable scorecard editor, following the existing drawer and form styles. */
.qa-drawer{width:min(990px,calc(100vw - 220px))!important;max-width:none!important}
.qa-intro{font-size:13px;color:#748198;line-height:1.8;margin:0 0 20px}
.qa-methods{display:flex;flex-wrap:wrap;gap:5px;margin:18px 0 8px}
.qa-item{border:1px solid #e4e9ef;border-radius:8px;margin-bottom:14px;background:#fff}
.qa-item>summary{display:flex;justify-content:space-between;gap:20px;cursor:pointer;padding:17px 18px;background:#fafbfd;border-radius:8px;font-size:13px;list-style:none}
.qa-item>summary b:before{content:'›';display:inline-block;margin-right:12px;color:#8090a4}
.qa-item[open]>summary b:before{transform:rotate(90deg)}
.qa-item>summary span{color:#7a889b;font-size:12px;white-space:nowrap}
.qa-itembody{padding:22px 20px 10px}
.qa-blocktitle{font-size:13px;font-weight:600;border-top:1px solid #edf0f4;padding:20px 0 16px}
.qa-item textarea{min-height:70px;line-height:1.7}
.qa-evidence{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa-evidence label{display:flex;align-items:center;gap:7px;font-size:12px!important;color:#59697c!important;margin:0!important;background:#fafbfd;padding:8px;border-radius:5px}
.qa-evidence small{color:#98a2b1;margin-left:auto}
.qa-itemfoot{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:10px 0 18px}
.qa-itemfoot .weighttotal{margin:0}
.qa-fields{border-top:1px solid #e6ebf0;border-bottom:1px solid #e6ebf0;padding:18px 0;margin:8px 0 25px}
.qa-fields summary,.qa-trialbox summary{font-size:13px;cursor:pointer;color:#5f7597;margin-bottom:14px}
.qa-trialbox{border:1px solid #dce6f1;background:#fafcff;border-radius:8px;padding:18px;margin-top:15px}
.qa-trialbox th,.qa-trialbox td{white-space:normal!important;min-width:90px}
.qa-trialbox td .sub{line-height:1.65;margin-top:8px}
.qa-trialbox select{font-size:12px;max-width:150px}
.qa-total{padding-top:18px;font-size:15px;font-weight:600}
.qa-total .hint{font-weight:400}
@media(max-width:900px){.qa-drawer{width:calc(100vw - 30px)!important}.qa-evidence{grid-template-columns:1fr}.qa-item>summary{display:block}.qa-item>summary span{display:block;margin-top:8px}}

function qaValidate(){
 const s=standardDraft;if(!s.name.trim())return '请填写标准名称';if(!s.items.length)return '至少保留一个检查项';if(s.items.reduce((n,x)=>n+x.weight,0)!==100)return '检查项权重合计须为 100%';if(!Number.isInteger(s.threshold)||s.threshold<0||s.threshold>100)return '通过分数须为 0–100 的整数';
 for(const [i,x] of s.items.entries()){
  const err=t=>`第 ${i+1} 项：${t}`;
  if(!x.name.trim()||!x.meaning.trim()||!x.good.trim()||!x.bad.trim())return err('名称、含义和达标 / 不达标条件必填');
  if(!x.evidence.length)return err('至少关联一种证据材料');
  if([x.weight,x.pass,x.fail,...(['场景期望','人工判断'].includes(x.method)?[x.partial]:[])].some(v=>!Number.isInteger(v)||v<0||v>100))return err('权重与分值须为 0–100 整数');
  if(x.pass<=x.fail||(['场景期望','人工判断'].includes(x.method)&&(x.partial>x.pass||x.partial<x.fail||!x.middle.trim())))return err('达标分须高于不达标分，部分达标分须位于两者之间且有判断条件');
  if(x.apply==='condition'&&(!qaField(x.applyField)||!x.applyValue.trim()))return err('适用字段及值必填');
  if(x.method==='规则命中'&&!x.rule.trim())return err('请选择关联规则');
  if(x.method==='字段比较'){
   const l=qaField(x.left),r=qaField(x.right);if(!l||x.rhsMode==='另一字段'&&(!r||r.type!==l.type))return err('比较字段必须存在且类型一致');
   if(l.type!=='数值'&&!['=','!='].includes(x.operator))return err('文本 / 布尔字段仅支持相等或不等');
   if(x.rhsMode==='常量'&&(!String(x.value).trim()||l.type==='数值'&&!Number.isFinite(Number(x.value))||l.type==='布尔'&&!['true','false'].includes(x.value)))return err('期望值须与字段类型一致');
  }
 }
 return '';
}

function qaResult(i,x){

 const needed=x.method==='字段比较'?[x.left,...(x.rhsMode==='另一字段'?[x.right]:[])]:x.method==='规则命中'?['rule.hit']:x.evidence;

 if(x.method==='规则命中'&&!['true','false'].includes(String(v['rule.hit'])))return {status:'无法判断',reason:'规则命中值须为布尔值'};
 if(x.method==='字段比较'&&qaField(x.left)?.type==='布尔'&&[v[x.left],x.rhsMode==='另一字段'?v[x.right]:x.value].some(z=>!['true','false'].includes(String(z))))return {status:'无法判断',reason:'比较字段须为布尔值'};
 let ok,reason;if(x.method==='规则命中'){ok=String(v['rule.hit'])===x.expected;reason=`${x.rule}：${String(v['rule.hit'])==='true'?'命中':'未命中'}（模拟单条规则结果）`}else{

  if(type==='数值'&&(!Number.isFinite(a)||!Number.isFinite(b)))return {status:'无法判断',reason:'字段值不是有效数值'};
  ok=({'=':()=>a===b,'!=':()=>a!==b,'>':()=>a>b,'>=':()=>a>=b,'<':()=>a<b,'<=':()=>a<=b}[x.operator])();reason=`${qaField(x.left)?.label} ${v[x.left]} ${x.operator} ${x.rhsMode==='另一字段'?qaField(x.right)?.label+' '+v[x.right]:x.value}`;
 }return {status:ok?'达标':'不达标',reason};

function openRecord(id,changeUrl=true){const r=state.records.find(x=>x.id===id);currentRecord=id;if(changeUrl)history.replaceState(null,'','#/records?record='+id);const queued=r.status==='初检排队中',missing=r.score===null||r.status==='资料不足',voice=r.channel==='电话';$('#overlay').innerHTML=`<div class="mask"><section class="drawer" role="dialog" aria-modal="true" aria-label="质检详情"><div class="drawerhead"><button class="iconbtn" aria-label="关闭质检详情" onclick="closeRecord()">${icon('close')}</button><h2>质检详情</h2><span class="sub" style="margin:0">${r.id}</span><div class="right">${statusTag(r.status)} ${btn('原会话',`toast('演示数据，未连接真实会话 ${r.ref}')`,'linkbtn')}</div></div><div class="detailmeta"><div><span>被检对象</span>${esc(r.agent)} · ${r.kind}</div><div><span>质检标准</span>${esc(r.ver)}</div><div><span>入选原因</span>${esc(r.source)}</div></div><div class="split"><section class="conversation" id="conversation-evidence"><div class="tinytitle"><span>${icon(voice?'phone':'mail')} ${voice?'通话录音与转写':'邮件会话'}</span><span>${r.time}</span></div><h3 style="font-size:15px;font-weight:600;margin:0 0 18px">${esc(r.subject)}</h3>${voice?voiceEvidence(r):mailEvidence(r)}</section><section class="reviewpane" id="review-pane"><div class="reviewcontent"><div class="tinytitle"><span>AI 初检结果</span><span>${esc(r.ver)}</span></div><div class="scorehero"><strong>${missing?'—':r.score} <small>${missing?'':'/ 100'}</small></strong><div>${tag(queued?'等待初检':missing?'无法判定':r.score<85?'未通过':'通过',missing?'orange':r.score<85?'red':'green')}<div class="sub">${queued?'初检尚未执行':missing?'不生成得分与合格结论':(['已确认','已裁决'].includes(r.status)?'原始初检结果保留':'初检结果待人工核验')}</div></div></div>${queued?'<div class="notice">已进入演示初检队列，尚无得分。本原型不会调用真实模型或自动伪造结果。</div>':missing?`<div class="notice warning">${voice?'录音或转写尚未就绪':'业务依据或上下文不足'}，当前材料无法支持评分。不会自动记为合格或 0 分。</div><div class="checkitem" style="margin-top:14px"><div class="checkhead">材料完整性 ${tag('待补充','orange')}</div><p>${voice?'录音 / 转写：待补充':'上下文 / 政策证据：待补充'}<br>最近尝试：2026-10-29 09:30</p>${btn('补齐后重新检查','retryRecord()','linkbtn')}</div>`:checkItems(r)}${missing?'':reviewForm(r)}<div class="history" id="review-history"><p><b>2026-10-29 09:00 · AI 初检</b><br>${queued?'等待初检执行':missing?'因材料不足中止评估':'检查完成，原始分数 '+r.score+'，证据版本已保留'}</p>${r.history.map(h=>`<p><b>${esc(h.at)} · ${esc(h.who)}</b><br>${esc(h.text)}</p>`).join('')}</div></div></section></div><div class="drawerfooter"><span class="footerlabel">${esc(r.plan)} · 演示证据，未接入真实邮件或录音</span><div class="tools">${btn('关闭','closeRecord()')}${r.status==='待复核'?btn('提交复核','submitReview(false)','primarybtn'):r.status==='申诉中'?btn('提交裁决','submitReview(true)','primarybtn'):''}</div></div></section></div>`}

function mailEvidence(r){if(r.id.endsWith('001'))return `<div class="message"><div class="messagehead"><span class="avatar">C</span>客户来信<small>10-28 15:48</small></div><p>Hello, my order arrived damaged. Could I get a full refund? Please also let me know when it will reach my account.</p></div><div class="message reply" id="evidence-target"><div class="messagehead"><span class="avatar">林</span>林晓 · 人工回复<small>10-28 16:24</small></div><p>Hi, I'm sorry to hear about the damage.</p><p><mark>We have approved your full refund, and the money will arrive within 24 hours.</mark></p><p>Thank you for your patience.</p></div><div class="evidence">业务证据快照 · Refund SOP v3<br>退款批准须有审批单；到账时间由支付渠道决定。本演示订单快照中尚无审批记录。<br><span class="muted">本段是合成材料，用于演示“原文 + 业务依据”的核对方式。</span></div>`;if(r.id.endsWith('006'))return `<div class="message"><div class="messagehead">前序人工回复 · 周宁<small>10-26 14:20</small></div><p>We will review your replacement request within 3 business days.</p></div><div class="message"><div class="messagehead">客户来信<small>10-27 10:10</small></div><p>Thank you. I have attached the requested photos.</p></div><div class="message reply" id="evidence-target"><div class="messagehead">周宁 · 本次被检回复<small>10-27 10:46</small></div><p>Thank you for sending the photos. We have received them and will get back to you.</p></div><div class="evidence">申诉证据：上一封已承诺 3 个工作日。裁决需判断本次检查单元是否要求每封重复时效。</div>`;return `<div class="message"><div class="messagehead">客户来信<small>${r.date} 10:00</small></div><p>Could you help me check the latest update and explain the next steps?</p></div><div class="message reply" id="evidence-target"><div class="messagehead">${esc(r.agent)} · ${r.kind} 回复<small>${r.time}</small></div><p>Hi, thank you for reaching out. I have checked the latest information and included the next steps below.</p><p>Your request is being processed. We will update you within 2 business days. Please reply here if you have any questions.</p></div><div class="evidence">业务证据快照 · 演示政策允许本回复所述处理路径。正式质检需引用当时适用的政策版本。</div>`}
function voiceEvidence(r){if(r.status==='初检排队中')return '<div class="notice">手动入选通话 · 演示初检排队中，尚无实际音频或检查结果。</div>';if(r.score===null)return `<div class="notice warning">通话已结束，录音及转写材料未就绪。材料不足期间不评估服务质量。</div><div class="empty">${icon('phone')}<br>等待录音与转写<br><span class="sub">原通话时长 03:26 · 实际责任归属待材料确认</span></div>`;const ai=r.kind==='AI';const lines=ai?[['00:03','AI','您好，这里是客户服务中心，想了解一下您最近的使用体验。'],['00:18','客户','我现在不方便，也不需要推荐，请不要再联系我。'],['01:12','AI','只需要一分钟，我们最近还有一个特别优惠，您可以了解一下。'],['01:25','客户','已经说了不需要了。']]:[['00:02','客服','您好，请问有什么可以帮您？'],['00:15','客户','我想查询一下订单的退款进度。'],['01:12','客服','您这笔订单目前在退款审核中，我已经打开您的订单详情。'],['01:36','客户','好的，那大概什么时候能处理完成？']];return `<div class="voiceplayer" id="voice-player"><div class="voicebar"><button class="iconbtn" aria-label="播放录音演示" onclick="toast('仅展示录音定位交互，本原型无真实音频')">${icon('play')}</button><span class="sub" style="margin:0" id="voice-position">00:00</span><div class="wave">${Array.from({length:65},(_,i)=>`<i class="${i<15?'past':''}" style="height:${7+((i*17+9)%25)}px"></i>`).join('')}</div><span class="sub" style="margin:0">${ai?'02:06':'04:32'}</span></div><div class="hint">模拟录音控制 · 点击问题定位时间点，无真实音频</div></div>${lines.map(([t,s,text])=>`<div class="line" id="${t==='01:12'?'evidence-target':'line-'+t.replace(':','')}"><button class="time" onclick="seek('${t}')">${t}</button><span class="speaker">${s}</span><span>${text}</span></div>`).join('')}${ai?'<div class="evidence">外呼上下文 · AI 外呼示例（虚构） v12<br>流程节点：客户意愿判断 → 推介<br>工具调用：本例无工具写入<br>检查依据：拒绝继续联系后，应终止推介并按策略记录意愿。</div>':'<div class="evidence">检查依据 · 身份核验 SOP v2<br>在访问订单敏感信息前需完成规定身份核验。以上转写未出现核验步骤，待质检员结合录音确认。</div>'}`}

function checkItems(r){const problematic=r.score<85;const rows=[['准确性',r.id.endsWith('001')?'退款已批准与 24 小时到账缺少业务证据。':'解答内容与可用业务材料核对。',problematic&&r.id.endsWith('001')?'待确认问题':'通过'],['完整性',r.id.endsWith('006')?'本次回复未再次说明处理时间；前序邮件有时效承诺。':'检查客户问题是否被完整覆盖。',r.id.endsWith('006')?'待确认问题':'通过'],['表达与体验',r.kind==='AI'?'客户明确拒绝后仍继续推介。':'措辞清晰，未发现明显不当表达。',r.kind==='AI'?'待确认问题':'通过'],['流程执行',r.id.endsWith('002')?'访问订单信息前未识别到身份核验步骤。':'核对当前业务要求与流程证据。',r.id.endsWith('002')?'待确认问题':'通过']];return `<div id="check-items">${rows.map(([t,reason,result])=>`<div class="checkitem"><div class="checkhead">${t} ${tag(result,result==='通过'?'green':'orange')}</div><p>${reason}</p>${result!=='通过'?btn(icon('search')+(r.channel==='电话'?'定位 01:12':'查看原文与依据'),'locateEvidence()','linkbtn'):''}</div>`).join('')}</div>`}
function reviewForm(r){if(r.status==='申诉中')return `<div class="reviewform" id="adjudicate-form"><h3>主管裁决</h3><div class="hint" style="margin-bottom:10px">申诉与原复核记录保留，裁决独立生成。</div><div class="field"><label>裁决结论</label><select id="decision"><option>维持原结果</option><option>采纳申诉</option><option>退回补充材料</option></select></div><div class="field"><label>最终裁决分</label><input type="number" id="final-score" min="0" max="100" value="${r.final??r.score}"></div><div class="field"><label>裁决原因（必填）</label><textarea id="review-reason" placeholder="说明所依据的上下文与标准"></textarea></div><div class="error" id="review-error"></div></div>`;if(['已确认','已裁决'].includes(r.status))return `<div class="reviewform"><h3>${r.status==='已裁决'?'最终裁决':'人工复核'} · ${r.final??r.score} 分</h3><div class="hint">${esc(r.decision||'确认 AI 结果')}<br>AI 初评 ${r.score} · 人工复核 ${r.reviewScore??r.final}${r.adjudicatedScore!==undefined?' · 最终裁决 '+r.adjudicatedScore:''}</div><div class="tools" style="margin-top:12px">${btn('反馈 / 发起申诉',`appeal('${r.id}')`)}${btn(r.remediation?'查看整改':'创建整改',`remediate('${r.id}')`)}</div>${r.remediation?'<div class="hint">整改：'+esc(r.remediation.status)+' · '+esc(r.remediation.owner)+'</div>':''}</div>`;if(r.status==='初检排队中')return `<div class="notice">已进入初检队列。本原型不自动生成新的评估结果。</div>`;return `<div class="reviewform" id="review-form"><h3>人工复核</h3><div class="field"><label for="decision">复核结论</label><select id="decision" onchange="changeDecision(this.value)"><option>确认 AI 结果</option><option>改判为无问题</option><option>调整问题与分数</option><option>资料不足</option></select></div><div class="field" id="score-field"><label for="final-score">人工复核分</label><input type="number" min="0" max="100" id="final-score" value="${r.score}"></div><div class="field"><label for="review-reason">复核意见</label><textarea id="review-reason" placeholder="改判、调分或资料不足时必须填写依据"></textarea></div><div class="hidden" id="item-adjustments"><div class="field"><label>人工检查项结论</label>${['准确性','完整性','表达与体验','流程执行'].map((t,i)=>`<div class="actionline" style="margin:8px 0"><span style="width:85px;font-size:11px">${t}</span><select aria-label="${t}复核结论" class="item-outcome"><option>保持 AI 判定</option><option>通过</option><option>不通过</option><option>不适用</option><option>无法判定</option></select></div>`).join('')}</div></div><div class="error" id="review-error"></div></div>`}
function submitReview(adjudicate){const r=state.records.find(x=>x.id===currentRecord),decision=$('#decision').value,reason=$('#review-reason').value.trim(),value=$('#final-score').value,score=Number(value),insufficient=['资料不足','退回补充材料'].includes(decision);if((adjudicate||decision!=='确认 AI 结果'||score!==r.score)&&!reason){$('#review-error').textContent='请填写判断依据，原始结果将继续保留。';return}if(!insufficient&&(value===''||!Number.isInteger(score)||score<0||score>100)){$('#review-error').textContent='分数请输入 0–100 的整数。';return}r.status=insufficient?'资料不足':adjudicate?'已裁决':'已确认';if(!insufficient){if(adjudicate){r.reviewScore=r.reviewScore??r.final;r.adjudicatedScore=score}else r.reviewScore=score;r.final=score;}r.decision=decision;if(!adjudicate){r.reviewItems=Array.from(document.querySelectorAll('.item-outcome')).map(e=>e.value)}r.history.push({at:'2026-10-29 10:00',who:adjudicate?'质检主管':'rick.yuan',text:decision+(insufficient?'':'，'+(adjudicate?'裁决':'复核')+'分 '+score)+(reason?'；'+reason:'')+(!adjudicate&&decision==='调整问题与分数'?'；检查项：'+r.reviewItems.join(' / '):'')});persist();openRecord(r.id);toast(adjudicate?'裁决已保存，初检与复核历史保留':'复核已保存，AI 原始分数保留')}
function appeal(id){modal('发起申诉',`<div class="field required"><label for="appeal-reason">申诉理由与证据</label><textarea id="appeal-reason" placeholder="请说明需重新判断的检查项、上下文或政策依据"></textarea></div><div class="error" id="appeal-error"></div><p>演示本人反馈路径；正式系统仅本人或授权人员可提交，主管裁决需独立权限。</p>`,'提交申诉',()=>{const reason=$('#appeal-reason').value.trim();if(!reason){$('#appeal-error').textContent='请填写申诉理由';return}const r=state.records.find(x=>x.id===id);r.status='申诉中';r.history.push({at:'2026-10-29 10:05',who:r.agent,text:'申诉：'+reason});persist();openRecord(id);toast('已提交申诉，等待主管裁决')})}

function manualInspect(){modal('发起质检',`<div class="field"><label for="manual-object">选择演示会话</label><select id="manual-object"><option value="邮件">邮件 #DEMO-1202 · 已发送回复</option><option value="电话">电话 CALL-DEMO-2201 · 已结束通话</option></select></div><div class="field"><label for="manual-reviewer">复核人</label><select id="manual-reviewer"><option>rick.yuan</option><option>质检主管</option></select></div><p>采用对应渠道最新评分标准。若相同对象、材料版本与标准版本已经检查，复用已有记录并追加入选原因。</p>`,'开始质检',()=>{const channel=$('#manual-object').value,ref=channel==='邮件'?'#DEMO-1202':'CALL-DEMO-2201',version=channel==='邮件'?'售后邮件 v'+state.standards[0].version:'人工电话 v'+state.standards[1].version,existing=state.records.find(r=>r.ref.includes(ref)&&r.ver===version);if(existing){openRecord(existing.id);toast('同版本已有记录，已打开');return}const r={id:'QC-DEMO-'+(state.records.length+1),subject:channel==='邮件'?'Re: Manual inspection demo #DEMO-1202':'人工电话 · 手动质检演示',ref:(channel==='邮件'?'邮件回复 · ':'通话 · ')+ref,channel,agent:'林晓',kind:'人工',team:'售后组',time:'2026-10-29 09:40',date:'2026-10-29',score:null,risk:'未判定',issue:'等待初检执行',status:'初检排队中',plan:'手动质检',source:'手动入选',reviewer:$('#manual-reviewer').value,ver:channel==='邮件'?'售后邮件 v'+state.standards[0].version:'人工电话 v'+state.standards[1].version,history:[]};state.records.unshift(r);persist();closeOverlay();filters.view='全部记录';renderRecords();toast('演示质检记录已进入队列')})}

function renderPlans(){const plans=state.plans.filter(p=>!planFilter||(planFilter==='邮件'&&p.channel==='邮件')||(planFilter==='电话'&&p.channel==='电话')||(planFilter==='人工电话'&&p.channel==='电话'&&p.kind==='人工')||(planFilter==='AI'&&p.kind==='AI'));$('#pagebody').innerHTML=`<div class="notice" id="plan-overview">计划决定检查范围和执行规则；每次运行生成独立批次，质检记录与评分标准版本保留。${planFilter?btn('当前：'+(planFilter==='AI'?'AI 外呼示例':planFilter)+' · 清除筛选',"planFilter='';renderPlans()",'linkbtn'):''}</div><div style="height:20px"></div><div class="tablewrap"><table id="plan-list"><thead><tr><th>计划名称 / 范围</th><th>执行方式</th><th>人工复核</th><th>下一次运行</th><th>启用</th><th>操作</th></tr></thead><tbody>${plans.map(p=>`<tr><td><div class="planname">${esc(p.name)}</div><div class="sub">${p.kind} · ${p.channel} · ${esc(p.kind==='AI'?p.agent:p.team)}</div><div class="sub">${esc(state.standards[p.template]?.name||'自定义标准')} · 新批次使用生效版本</div></td><td>${scheduleLabel(p)}<div class="sub">${p.zone}</div></td><td>每人随机 ${p.sample} 条${p.risk?' + 高风险必检':''}<div class="sub">${esc(p.reviewer)} · ${p.due} 个工作日</div></td><td>${!p.enabled?'未启用':p.trigger==='事件'?'等待符合条件事件':p.trigger==='手动'?'—':nextSchedule(p).label}<div class="sub">${p.trigger==='定时'?'按计划固定时区':''}</div></td><td><button class="switch" role="switch" aria-label="${esc(p.name)}启用" aria-checked="${p.enabled}" onclick="togglePlan(${p.id})"></button></td><td><div class="tools">${btn('编辑',`editPlan(${p.id})`,'linkbtn')}${btn('运行记录',`showBatches(${p.id})`,'linkbtn')}</div></td></tr>`).join('')}</tbody></table></div><div class="caption">检查频率、数据范围和人工抽检量分别配置；自然半月为 1–15 日 / 16–月底，不等于每隔 14 天。</div>`}

function editPlan(id){planDraft=id?structuredClone(state.plans.find(p=>p.id===id)):{id:null,name:'',channel:'邮件',kind:'人工',team:'售后组',agent:'全部客服',template:0,trigger:'定时',frequency:'每周',time:'09:00',zone:'Asia/Shanghai',sample:5,reviewer:'rick.yuan',due:2,enabled:false,mode:'AI 初检 + 人工复核',range:'上一完整周期',risk:true};previewed=false;renderPlanEditor()}
function planSet(key,value,rerender=false){
 planDraft[key]=value;previewed=false;
 if(key==='team'&&planDraft.kind==='人工'){if(!qaPeople(planDraft.team).includes(planDraft.agent))planDraft.agent='全部客服';rerender=true}

function nextSchedule(p){
 const ref=new Date('2026-10-29T02:00:00Z');
 const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:p.zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
 const parts=d=>Object.fromEntries(fmt.formatToParts(d).filter(x=>x.type!=='literal').map(x=>[x.type,Number(x.value)]));

   const day=new Date(base.getTime()+i*86400000), y=day.getUTCFullYear(),mo=day.getUTCMonth(),dd=day.getUTCDate();

   if(!matches)continue;
   const target=Date.UTC(y,mo,dd,h,m); let utc=target;
   for(let j=0;j<3;j++){const x=parts(new Date(utc));utc+=target-Date.UTC(x.year,x.month-1,x.day,x.hour,x.minute)}

 }

}

    "text": "定位：`#/records` → `#quality-entry`\n\n**01.1 功能交互**\n\n- 01.1.1 工作台侧栏增加独立“质检”，统一管理记录、计划、评分标准、分析；人工服务不依赖创建机器人。\n- 01.1.2 主线是已发送邮件、已结束电话的事后质检；AI 初检与纯人工评审共用记录及证据。\n- 01.1.3 计划生成运行批次，批次产生质检记录；原文核验、人工复核、申诉裁决和整改依次留痕。\n- 01.1.4 智能客服设置提供邮件与电话两个并列入口，进入同一套计划，不另建同名配置。\n\n**01.2 影响范围**\n\n| 模块 | 变化 | 方案完整性 | 细项 |\n| --- | --- | --- | --- |\n| 工作台导航、质检记录 | 独立入口、统一队列、责任归属、筛选 | 必做 | 02—04 |\n| 邮件、电话详情 | 原文、业务依据、录音秒点、资料不足 | 启用对应渠道时必做 | 05—07 |\n| 人工评审 | AI 初评、复核、裁决分开保存，原因留痕 | 必做 | 08—09 |\n| 长期计划、执行批次 | 周期、事件、抽样、预览、暂停、重试 | 启用自动质检时必做 | 10—13 |\n| 评分标准 | 渠道适用范围、权重、未知、版本快照 | 必做 | 14 |\n| 质检分析 | 明确分母和采样口径 | 基础计数必做；趋势扩展可选 | 15 |\n| 智能客服 | 邮件与电话并列配置入口 | 两个渠道均纳入；共用工作台对象 | 16 |\n| 整改与辅导 | 负责人、期限、完成证据 | 可独立拆分 | 17 |\n| 权限与证据可用性 | 沿用租户、团队、渠道权限 | 真实业务接入时必做 | 18 |\n\n**01.3 本原型边界**\n\n- 01.3.1 先展示完整方案，再共同确定开发步骤；原型出现的页面不等于全部已排期。\n- 01.3.2 均为合成记录和材料，操作仅保存本地；未执行真实检查、播放真实录音、发送消息或配置后台任务。\n- 01.3.3 不包含发送前阻断、实时通话监听、自动改写客服回复；AI 分数不直接用于绩效。"

    "title": "权限、数据接入与验收边界",
    "location": "全局；`#quality-entry` 和详情“原会话”",
    "text": "定位：全局；`#quality-entry` 和详情“原会话”\n\n**功能交互**：管理员管计划/标准，质检员看授权范围并评审，主管裁决，客服看本人并反馈；沿用当前租户、团队、渠道的数据边界，原会话跳转仍校验权限。\n\n**影响范围**：菜单可见性、API 查询和提交授权、录音/原文访问、审计与导出。不能只依赖隐藏按钮保护数据。\n\n**验收边界**：本地原型不实现登录和真实鉴权、不连远端、不发送任何业务消息。正式进入开发前须核验录音/转写/作者/政策数据可得、后端契约、灰度策略及标准试评，区分代码存在、MR 计划和真实部署。"
  }
];

</script><script>
/* A small bespoke review dock, with no proto-annotation dependency. */
(()=>{
 const notes=window.QUALITY_REVIEW_NOTES||[];
 if(!notes.length)return;
 const encode=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const inline=s=>encode(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
 function markdown(s){
   const lines=s.split('\n');let html='',list=false;
   for(let i=0;i<lines.length;i++){
     const line=lines[i].trim();
     if(line.startsWith('|')){
       if(list){html+='</ul>';list=false}
       let rows=[];while(i<lines.length&&lines[i].trim().startsWith('|')){rows.push(lines[i].trim().split('|').slice(1,-1).map(x=>x.trim()));i++}i--;
       html+='<div class="review-scope">'+rows.slice(2).map(row=>'<div class="review-scope-row"><b>'+inline(row[0])+'</b><span>'+inline(row[1]||'')+'</span><span class="review-scope-meta">'+inline(row.slice(2).join(' · '))+'</span></div>').join('')+'</div>';continue;
     }
     if(!line){if(list){html+='</ul>';list=false}continue}
     if(line.startsWith('- ')){if(!list){html+='<ul>';list=true}html+='<li>'+inline(line.slice(2))+'</li>'}
     else{if(list){html+='</ul>';list=false}html+='<p>'+inline(line)+'</p>'}
   }
   return html+(list?'</ul>':'');
 }
 const routes={
 '01':{route:'records',selector:'#quality-entry'},
 '02':{route:'records',selector:'#navigation .active'},
 '03':{route:'records',selector:'#record-list'},
 '04':{route:'records',selector:'#record-filters'},
 '05':{route:'records?record=QC-1029-001',selector:'#evidence-target'},
 '06':{route:'records?record=QC-1029-002',selector:'#voice-player'},
 '07':{route:'records?record=QC-1029-005',selector:'#review-pane'},
 '08':{route:'records?record=QC-1029-001',selector:'#review-form',fallback:'#review-pane'},
 '09':{route:'records?record=QC-1029-006',selector:'#adjudicate-form',fallback:'#review-pane'},
 '10':{route:'plans',selector:'#plan-scope',setup:()=>editPlan(1)},
 '11':{route:'plans',selector:'#plan-trigger',setup:()=>{editPlan(1);planDraft.frequency='自然半月';renderPlanEditor()}},
 '12':{route:'plans',selector:'#sampling-preview',setup:()=>{editPlan(1);previewPlan()}},
 '13':{route:'plans',selector:'#batch-history',setup:()=>showBatches(1)},
 '14':{route:'standards',selector:'#standard-weights',setup:()=>editStandard(0)},
 '15':{route:'analysis',selector:'#analysis-metrics'},
 '16':{route:'ai-quality',selector:'#email-quality-link'},
 '17':{route:'records?record=QC-1029-004',selector:'.modal',setup:()=>remediate('QC-1029-004')},
 '18':{route:'records',selector:'#quality-entry'}
 };
 const params=new URLSearchParams(location.search);
 let enabled=params.get('review')==='1',active=notes.some(n=>n.number===params.get('note'))?params.get('note'):'01',anchor=null,navigationToken=0,scheduled=false;
 const toggle=document.createElement('button');toggle.className='review-toggle';toggle.id='quality-review-toggle';toggle.title='原型评审批注，不是产品功能';toggle.innerHTML='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h14v11H8l-4 3v-3H3zM6 7h8M6 10h5"/></svg>批注 <span>'+notes.length+'</span>';toggle.onclick=()=>setEnabled(!enabled);
 document.querySelector('.topright').prepend(toggle);
 const dock=document.createElement('aside');dock.className='review-dock';dock.id='quality-review-dock';dock.setAttribute('aria-label','原型开发批注');dock.innerHTML='<div class="review-dock-head"><div class="review-dock-title">开发批注 <small>原型评审</small><button class="review-dock-close" aria-label="关闭批注">×</button></div><p>编号定位到对应页面，仅作评审说明。</p><select class="review-picker" aria-label="选择开发批注">'+notes.map(n=>'<option value="'+n.number+'">'+n.number+'　'+encode(n.title)+'</option>').join('')+'</select></div><div class="review-content" tabindex="0"></div><div class="review-dock-footer"><button data-step="-1" aria-label="上一条批注">‹ 上一条</button><small class="review-progress"></small><button data-step="1" aria-label="下一条批注">下一条 ›</button></div>';
 document.body.append(dock);
 dock.querySelector('.review-dock-close').onclick=()=>setEnabled(false);
 dock.querySelector('select').onchange=e=>selectNote(e.target.value,true);
 dock.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const i=notes.findIndex(n=>n.number===active)+Number(b.dataset.step);if(notes[i])selectNote(notes[i].number,true)});
 const pins=notes.map(n=>{const b=document.createElement('button');b.className='review-pin';b.textContent=n.number;b.setAttribute('aria-label','批注 '+n.number+' '+n.title);b.title=n.number+' '+n.title;b.hidden=true;b.onclick=()=>selectNote(n.number,false);document.body.append(b);return {note:n,button:b}});
 function setEnabled(value){enabled=value;document.body.classList.toggle('review-open',value);dock.hidden=!value;toggle.setAttribute('aria-pressed',String(value));if(!value){if(anchor)anchor.classList.remove('review-anchor-current');anchor=null}draw();schedulePins()}
 function draw(){const n=notes.find(n=>n.number===active),i=notes.indexOf(n);dock.querySelector('select').value=active;const body=n.text.replace(/^定位：[^\n]*\n*/,'');dock.querySelector('.review-content').innerHTML='<div class="review-note-number">NOTE '+n.number+'</div><h2>'+encode(n.title)+'</h2>'+markdown(body)+'<div class="review-location">'+inline(n.location)+'<br><button id="review-relocate">定位到此处 ↗</button></div>';dock.querySelector('.review-content').scrollTop=0;dock.querySelector('#review-relocate').onclick=()=>navigate(active);dock.querySelector('.review-progress').textContent=(i+1)+' / '+notes.length;dock.querySelector('[data-step="-1"]').disabled=i===0;dock.querySelector('[data-step="1"]').disabled=i===notes.length-1}
 function selectNote(number,shouldNavigate){active=number;if(!enabled)setEnabled(true);else draw();if(shouldNavigate)navigate(number);else focusAnchor(number,false);schedulePins()}
 function getAnchor(number){const c=routes[number];return document.querySelector(c.selector)||(c.fallback&&document.querySelector(c.fallback))}
 function focusAnchor(number,scroll){if(anchor)anchor.classList.remove('review-anchor-current');anchor=getAnchor(number);if(anchor){anchor.classList.add('review-anchor-current');if(scroll)anchor.scrollIntoView({block:'center',behavior:'auto'})}schedulePins()}
 async function navigate(number){
   const token=++navigationToken,c=routes[number];
   if(c.route==='plans')planFilter='';
   if(c.route.startsWith('records')){filters={view:'全部记录',channel:'全部渠道',kind:'全部对象',status:'全部状态',q:'',start:'2026-10-01',end:'2026-10-29'}}
   if(location.hash!=='#/'+c.route)go(c.route);else{closeOverlay();render()}
   await new Promise(requestAnimationFrame);await new Promise(requestAnimationFrame);
   if(token!==navigationToken)return;
   if(c.setup)c.setup();
   await new Promise(requestAnimationFrame);
   if(token===navigationToken)focusAnchor(number,true);
 }
 function isVisible(element){if(!element)return false;const r=element.getBoundingClientRect();return r.width>0&&r.height>0&&r.bottom>48&&r.top<innerHeight&&r.right>0&&r.left<innerWidth-(enabled?dock.offsetWidth:0)}
 function updatePins(){
   scheduled=false;const path=location.hash.replace('#/','').split('?')[0],open=!!document.querySelector('#overlay [role="dialog"]'),record=new URLSearchParams(location.hash.split('?')[1]).get('record');const placed=[];
   for(const {note,button} of pins){const c=routes[note.number],routePath=c.route.split('?')[0],recordId=new URLSearchParams(c.route.split('?')[1]).get('record'),el=getAnchor(note.number);let visible=enabled&&path===routePath&&isVisible(el);if(recordId)visible=visible&&record===recordId;else if(open&&!c.setup)visible=false;if(c.setup&&!open)visible=false;
     if(!visible){button.hidden=true;continue}
     const r=el.getBoundingClientRect(),maxX=innerWidth-dock.offsetWidth-28;let x=Math.max(4,Math.min(r.right-13,maxX)),y=Math.max(48,Math.min(r.top+6,innerHeight-35));
     const clip=el.closest('.drawerbody,.reviewcontent,.conversation,.pagebody');if(clip){const cr=clip.getBoundingClientRect();if(r.bottom<cr.top||r.top>cr.bottom){button.hidden=true;continue}y=Math.max(y,cr.top+4)}
     for(const p of placed)if(Math.abs(x-p.x)<25&&Math.abs(y-p.y)<26)y=p.y+29;
     placed.push({x,y});button.hidden=false;button.style.left=x+'px';button.style.top=y+'px';button.classList.toggle('active',note.number===active);
   }
 }
 function schedulePins(){if(!scheduled){scheduled=true;requestAnimationFrame(updatePins)}}
 window.addEventListener('resize',schedulePins);document.addEventListener('scroll',schedulePins,true);window.addEventListener('hashchange',schedulePins);
 const observer=new MutationObserver(schedulePins);observer.observe(document.querySelector('#main'),{childList:true,subtree:true});observer.observe(document.querySelector('#overlay'),{childList:true,subtree:true});
 setEnabled(enabled);if(enabled&&params.get('note'))navigate(active);
})();

</script></body></html>
