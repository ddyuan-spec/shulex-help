<aside class="side"><button class="system-switch" type="button"><span data-icon="report"></span> 报表 <span style="margin-left:auto;color:#a3abb5">☰</span></button><div class="nav"><div><span data-icon="report"></span> Agent 看板</div><div class="active"><span data-icon="report"></span> 工作台看板</div></div><div class="bottom"><div style="padding:8px;color:#8f98a7">◎　 ▤</div><div class="profile"><span class="avatar">r</span><span>示例用户</span><span style="margin-left:auto">›</span></div></div></aside>
<aside class="sub"><h2>报表</h2><div class="menu"><span data-icon="grid"></span> 总览</div><div class="menu active"><span data-icon="ticket"></span> 工单</div><div class="menu"><span data-icon="chat"></span> 会话</div><div class="menu"><span data-icon="phone"></span> 电话</div><div class="menu"><span data-icon="grid"></span> 坐席与队列监控</div></aside>

<main class="workspace"><div class="header"><h1 id="pageTitle">工单</h1><div class="top-tabs" id="topTabs"><span>工单</span><span>效率</span><span>客服活动</span><span>客服更新</span><span>未解决工单</span><span class="active">满意度</span><span>SLA</span></div></div><div class="body" id="scrollBody"><div id="page"></div></div></main><div id="floating"></div><div id="metricTooltip" class="metric-tooltip" role="tooltip" hidden></div><div id="toast" class="toast hidden" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iconPaths={report:'M4 4h16v16H4z M8 15v-4 M12 15V8 M16 15V6',panel:'M3 4h18v16H3z M9 4v16',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9 M10 21h4',grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',ticket:'M4 6h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z M9 8v8',chat:'M21 11a8 8 0 0 1-8 8H8l-5 3 2-6a8 8 0 1 1 16-5z',phone:'M6 3h4l1 5-3 2a16 16 0 0 0 6 6l2-3 5 1v4a3 3 0 0 1-3 3A19 19 0 0 1 3 6a3 3 0 0 1 3-3z',calendar:'M4 5h16v15H4z M8 3v4 M16 3v4 M4 10h16',user:'M8 7a4 4 0 1 0 8 0 4 4 0 0 0-8 0 M4 21v-3a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5v3z',channel:'M9 3h6v5H9z M3 16h6v5H3z M15 16h6v5h-6z M12 8v4H6v4 M12 12h6v4',form:'M5 3h14v18H5z M8 8h8 M8 12h8 M8 16h5',flow:'M5 4h6v6H5z M13 14h6v6h-6z M11 7h6v7'};
function drawIcons(){document.querySelectorAll('[data-icon]').forEach(e=>{e.innerHTML='<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(iconPaths[e.dataset.icon]||iconPaths.grid)+'"/></svg>';});}
// Local synthetic data only. Different invitation links may belong to the same ticket.
const reportSide=$('.side').innerHTML, reportSub=$('.sub').innerHTML;
const pct=(n,d)=>d?(n/d*100).toFixed(2)+'%':'—';
const teams=['客服一组','客服二组','物流支持组'];
const agents=['客服甲','客服乙','客服丙'];
const channels=['邮件','WhatsApp','Custom Chat'];
const records=Array.from({length:450},(_,i)=>({id:'LINK-'+(104000+i),ticket:98000+Math.floor(i/2),date:'2026-10-'+String(1+Math.floor(i/15)).padStart(2,'0'),sent:i%21!==0,clicked:false,score:null,team:teams[Math.floor(i/3)%3],agent:agents[Math.floor(i/9)%3],channel:channels[i%3]}));
const delivered=records.filter(r=>r.sent);
delivered.forEach((r,i)=>{r.clicked=i%7<4;});
for(let i=0;i<16;i++){const link=delivered[Math.floor(i*delivered.length/16)];link.score=i<12?4+i%2:1+i%3;link.clicked=true;}

const defaultState=()=>({start:'2026-10-01',end:'2026-10-30',team:'',agent:'',channel:'',grain:'day'});
let state=defaultState();
function cohort(){return records.filter(r=>r.date>=state.start&&r.date<=state.end&&(!state.team||r.team===state.team)&&(!state.agent||r.agent===state.agent)&&(!state.channel||r.channel===state.channel));}
function stats(rows){const sent=rows.filter(r=>r.sent),clicked=sent.filter(r=>r.clicked),filled=sent.filter(r=>r.score>=1&&r.score<=5),good=filled.filter(r=>r.score>=4),bad=filled.filter(r=>r.score<=3);return{sent:sent.length,clicked:clicked.length,filled:filled.length,good:good.length,bad:bad.length,rate:pct(clicked.length,sent.length),goodRate:pct(good.length,filled.length)};}
const DEFAULT_METRIC_KEYS=Object.freeze(['goodRate','good','bad','sent','filled','rate']);
const definitions={
 goodRate:{label:'好评率',formula:'好评链接数 ÷ 已填写链接数 × 100%',detail:'全部按邀评链接统计。4–5 分为好评，1–3 分为差评；同一工单的多个链接分别计数，不按工单去重。未填写不计入分母；无有效填写时显示“—”。'},
 good:{label:'好评数量',formula:'已填写邀评链接中，评分为 4–5 分的链接数量',detail:'每个已发出链接按自身有效评分归类，同一工单的多个好评链接分别计数。不按工单数或用户数统计。'},
 bad:{label:'差评数量',formula:'已填写邀评链接中，评分为 1–3 分的链接数量',detail:'1、2、3 分均计入差评，未填写链接不计入。同一工单的多个差评链接分别计数。'},
 sent:{label:'发出邀评数量',formula:'当前筛选范围内成功发出的邀评链接数量',detail:'按链接发送日期及所选条件统计；同一工单发出多个链接分别计数，不按工单去重。发送失败、仅生成未发送的链接不计入；同一链接本身只作为一条链接统计。'},
 filled:{label:'已填写邀评数量',formula:'已发出的链接中，成功保存有效答案的链接数量',detail:'按链接是否已有效填写统计；同一工单的不同链接分别计数。同一链接重复提交不增加链接数量。已填写数量与被点击数量分别取数。'},
 rate:{label:'邀评链接点击率',formula:'被点击的邀评链接数 ÷ 总发出邀评链接数 × 100%',detail:'分子、分母使用同一批已发出链接。每个链接按是否被点击统计，重复点击不增加链接数量，不按工单去重。点击不等于填写；填写率另为已填写链接数 ÷ 总发出链接数。本卡只显示点击率；分母为 0 时显示“—”。'}
};
function help(key){return '<button class="metric-help" type="button" data-help="'+key+'" aria-label="'+definitions[key].label+'的计算方式" aria-describedby="metricTooltip"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6a1.8 1.8 0 1 1 3.1 1.2C8.6 7.8 8 8.1 8 9.2M8 11.2h.01"/></svg></button>';}
function metricCards(s){return DEFAULT_METRIC_KEYS.map(key=>'<article class="metric" data-metric="'+key+'"><div class="label"><span>'+definitions[key].label+'</span>'+help(key)+'</div><strong>'+s[key]+'</strong></article>').join('');}
function filter(label,key,values,icon){return '<div class="chip"><span data-icon="'+icon+'"></span><label for="'+key+'">'+label+'</label><select id="'+key+'" aria-label="'+label+'"><option value="">全部</option>'+values.map(v=>'<option value="'+v+'" '+(state[key]===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div>';}
function render(){
 hideTooltip();
 const rows=cohort(),s=stats(rows);
 $('#page').innerHTML='<div class="filters"><div class="chip date"><span data-icon="calendar"></span><label for="period">发送日期</label><select id="period" aria-label="日期"><option value="30">近30天</option><option value="7">近7天</option><option value="custom">自定义</option></select></div>'+filter('团队','team',teams,'user')+filter('处理人','agent',agents,'user')+filter('渠道','channel',channels,'channel')+'<div class="chip muted-filter"><span data-icon="form"></span>售后邮箱⌄</div><div class="chip muted-filter">平台⌄</div><div class="chip muted-filter">店铺⌄</div><button class="link reset" id="reset">重置</button></div><div class="custom-dates '+(state.start==='2026-10-01'&&state.end==='2026-10-30'?'hidden':'')+'" id="customDates"><label>链接发送日期</label><input type="date" id="startDate" aria-label="开始日期" value="'+state.start+'"><span>—</span><input type="date" id="endDate" aria-label="结束日期" value="'+state.end+'"><button id="applyDate">应用</button></div><section class="metrics" aria-label="满意度统计">'+metricCards(s)+'</section><section class="card trend-card"><div class="card-heading"><h3>按日期好评率和已填写邀评数量</h3><div class="seg"><button data-grain="day" class="'+(state.grain==='day'?'active':'')+'">按日</button><button data-grain="month" class="'+(state.grain==='month'?'active':'')+'">按月</button></div></div><div class="legend"><span><i class="dot" style="background:#606bff"></i>好评率</span><span><i class="dot" style="background:#687b9e"></i>已填写邀评数量</span></div>'+trend(rows)+'</section><div class="lower-charts"><section class="card"><div class="card-heading"><h3>按团队好评率 Top 10</h3></div>'+bars(rows,'team',teams)+'</section><section class="card"><div class="card-heading"><h3>按渠道好评率 Top 10</h3></div>'+bars(rows,'channel',channels)+'</section></div><p class="footer-note">本地原型 · 演示数据 · '+state.start+' — '+state.end+' · Asia/Shanghai (GMT+08:00)</p>';
 $('#period').value=state.start==='2026-10-01'&&state.end==='2026-10-30'?'30':state.start==='2026-10-24'&&state.end==='2026-10-30'?'7':'custom';
 $('#period').onchange=e=>{if(e.target.value==='custom'){$('#customDates').classList.remove('hidden');return;}state.start=e.target.value==='7'?'2026-10-24':'2026-10-01';state.end='2026-10-30';render();};
 $('#applyDate').onclick=()=>{const start=$('#startDate').value,end=$('#endDate').value;if(!start||!end||start>end){toast('请选择有效的开始和结束日期');return;}state.start=start;state.end=end;render();};
 for(const key of ['team','agent','channel'])$('#'+key).onchange=e=>{state[key]=e.target.value;render();};
 $('#reset').onclick=()=>{state=defaultState();render();};
 document.querySelectorAll('[data-grain]').forEach(b=>b.onclick=()=>{state.grain=b.dataset.grain;render();});
 document.querySelectorAll('[data-help]').forEach(b=>{b.onmouseenter=()=>showTooltip(b);b.onmouseleave=hideTooltip;b.onfocus=()=>showTooltip(b);b.onblur=hideTooltip;b.onclick=()=>showTooltip(b);});
 drawIcons();
}
function trend(rows){
 if(!rows.length)return '<div class="empty">暂无符合条件的数据</div>';
 const keys=[...new Set(rows.map(r=>state.grain==='day'?r.date:r.date.slice(0,7)))].sort();
 const points=keys.map(key=>stats(rows.filter(r=>(state.grain==='day'?r.date:r.date.slice(0,7))===key)));
 const width=1000,height=245,left=56,right=55,top=27,bottom=34,plotW=width-left-right,plotH=height-top-bottom,max=Math.max(5,...points.map(p=>p.filled));
 const x=i=>keys.length===1?left+plotW/2:left+i*plotW/(keys.length-1),y=p=>top+(100-p)/100*plotH,yCount=n=>top+(max-n)/max*plotH;
 const ticks=[0,25,50,75,100].map(v=>'<line x1="'+left+'" y1="'+y(v)+'" x2="'+(width-right)+'" y2="'+y(v)+'" stroke="#f0f1f4"/><text x="'+(left-12)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'%</text><text x="'+(width-right+12)+'" y="'+(y(v)+4)+'">'+Math.round(v/100*max)+'</text>').join('');
 // Gaps with no evaluations remain gaps instead of fabricating a 0% rating.
 let active=false;const path=points.map((p,i)=>{if(!p.filled){active=false;return '';}const cmd=active?'L':'M';active=true;return cmd+x(i)+','+y(p.good/p.filled*100);}).join(' ');
 const labels=keys.map((key,i)=>i===0||i===keys.length-1||i%Math.max(1,Math.ceil(keys.length/7))===0?'<text x="'+x(i)+'" y="'+(height-10)+'" text-anchor="middle">'+key.slice(state.grain==='day'?5:0)+'</text>':'').join('');
 return '<svg class="trend" viewBox="0 0 '+width+' '+height+'" role="img" aria-label="按'+(state.grain==='day'?'日':'月')+'统计好评率与已填写邀评数量"><text x="'+left+'" y="14">好评率</text><text x="'+(width-right)+'" y="14" text-anchor="end">已填写邀评数量</text>'+ticks+'<polyline fill="none" stroke="#687b9e" stroke-width="2.3" points="'+points.map((p,i)=>x(i)+','+yCount(p.filled)).join(' ')+'"/><path d="'+path+'" fill="none" stroke="#606bff" stroke-width="2.5"/>'+points.map((p,i)=>p.filled?'<circle cx="'+x(i)+'" cy="'+y(p.good/p.filled*100)+'" r="3" fill="#606bff"><title>'+keys[i]+'：好评率 '+p.goodRate+'，已填写 '+p.filled+'</title></circle>':'').join('')+labels+'</svg>';
}
function bars(rows,key,names){return '<div class="rank-bars">'+names.filter(name=>rows.some(r=>r[key]===name)).map(name=>{const s=stats(rows.filter(r=>r[key]===name));return '<div class="rank-row"><span>'+name+'</span><div class="rank-track"><div style="width:'+(s.filled?s.good/s.filled*100:0)+'%"></div></div><b>'+s.goodRate+'</b></div>';}).join('')+(rows.length?'':'<div class="empty">暂无符合条件的数据</div>')+'</div>';}
function showTooltip(button){const def=definitions[button.dataset.help],tip=$('#metricTooltip');tip.innerHTML='<strong>'+def.label+'</strong><div class="tooltip-formula">'+def.formula+'</div><p>'+def.detail+'</p>'+(button.dataset.help==='rate'?'<div class="tooltip-sample">当前范围：'+stats(cohort()).clicked+' ÷ '+stats(cohort()).sent+' × 100% = '+stats(cohort()).rate+'</div>':'');tip.hidden=false;const rect=button.getBoundingClientRect();const box=tip.getBoundingClientRect();tip.style.left=Math.max(12,Math.min(rect.left-16,innerWidth-box.width-12))+'px';tip.style.top=(rect.bottom+10+box.height<innerHeight?rect.bottom+10:Math.max(12,rect.top-box.height-10))+'px';}
function hideTooltip(){const tip=$('#metricTooltip');if(tip)tip.hidden=true;}
// Settings prototype: in-memory sample data; no network writes or real sends.
const exampleSurvey=()=>({id:1,title:'Customer Satisfaction Survey',language:'English',enabled:true,validity:7,unit:'天',subject:'How was your support experience?',body:'Thank you for contacting our support team.\n\nWe would love to hear about your experience. Please take a moment to share your feedback.',question:'How satisfied are you with our service?',description:'Your feedback helps us improve our service.'});
let surveys=[exampleSurvey()], surveyEditor=null;
function sendingGuide(){return '<section class="send-guide" aria-label="问卷发送方式"><div class="guide-title"><span class="guide-info">ⓘ</span>启用问卷后，可通过以下方式发送</div><div class="send-methods">'+[
 ['触发器','在 <strong>设置 → 触发器</strong> 配置发送问卷动作。工单新建或更新时，由已启用的规则按工单状态、渠道等条件匹配后自动发送。'],
 ['手动发送','在工单操作台插入问卷链接，随邮件回复发送给用户。'],
 ['主动触达','在触达邮件中插入满意度问卷链接变量，按触达计划发送。']
 ].map((m,i)=>'<div class="send-method"><span class="send-number">'+(i+1)+'</span><div><h3>'+m[0]+'</h3><p>'+m[1]+'</p></div></div>').join('')+'</div><div class="guide-foot">启用问卷仅表示问卷可用；自动发送需另行配置发送规则。</div></section>';}
let timer;function toast(msg){$('#toast').textContent=msg;$('#toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.add('hidden'),3000);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTooltip();});
document.addEventListener('scroll',hideTooltip,true);window.addEventListener('resize',hideTooltip);
render();
</script><script src="sample-data.js"></script><script src="report.js"></script></body></html>
