late-columns:1fr;gap:8px}.flow{display:block}.flow-arrow{transform:rotate(90deg);text-align:center}.panel,.diagram{padding:17px}h1{font-size:24px}th,td{padding:10px}.grid2{gap:0}}@media print{nav,header,button,.tabs{display:none!important}.layout{display:block}main{padding:0}.panel,.diagram{break-inside:avoid}.print-only{display:block}body{background:white}}

<script>
'use strict';
// timezone-business-plan-v2-20261028 — self-contained, synthetic data only.
const BEIJING='Asia/Shanghai',LA='America/Los_Angeles';
const state={personal:BEIJING,reportDefault:BEIJING,report:BEIJING,rule:LA,calendar:LA,org:BEIJING,team:LA,source:LA,quota:BEIJING,reportDate:'2026-10-27',matrix:'all',node:'personal',exports:[],calendarDraft:null,calendarVersion:1,pendingCalendar:null};
const aliases={
 'Asia/Shanghai':'北京时间 / 中国 / 北京 / 上海', 'America/Los_Angeles':'美西 / 洛杉矶 / 太平洋时间', 'America/New_York':'美东 / 纽约', 'Europe/London':'伦敦 / 英国', 'Europe/Berlin':'柏林 / 德国', 'Asia/Tokyo':'东京 / 日本', 'Asia/Singapore':'新加坡', 'Asia/Kolkata':'印度 / 加尔各答', 'Asia/Calcutta':'印度 / 加尔各答', 'Asia/Kathmandu':'尼泊尔 / 加德满都', 'Asia/Katmandu':'尼泊尔 / 加德满都', 'Australia/Sydney':'悉尼 / 澳大利亚', 'Pacific/Auckland':'奥克兰 / 新西兰', 'Asia/Dubai':'迪拜 / 阿联酋', 'America/Chicago':'芝加哥 / 美国中部', 'America/Denver':'丹佛 / 美国山区', 'Pacific/Honolulu':'檀香山 / 夏威夷', 'UTC':'协调世界时 UTC'
};
const common=[BEIJING,LA,'America/New_York','Europe/London','Asia/Tokyo','Asia/Singapore','Asia/Kolkata','Asia/Kathmandu','Australia/Sydney','UTC'];
let zones=[...new Set([...common,...(Intl.supportedValuesOf?Intl.supportedValuesOf('timeZone'):[])])];
const records=[{id:'DEMO-01',utc:'2026-10-26T22:38:00Z',kind:'邮件'},{id:'DEMO-02',utc:'2026-10-27T08:13:00Z',kind:'邮件'},{id:'DEMO-03',utc:'2026-10-27T22:38:00Z',kind:'邮件'},{id:'DEMO-04',utc:'2026-10-27T23:30:00Z',kind:'邮件'}];
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function short(z){return ({[BEIJING]:'北京时间',[LA]:'洛杉矶时间','America/New_York':'纽约时间','Europe/London':'伦敦时间','UTC':'UTC'})[z]||z.split('/').pop().replaceAll('_',' ')}
function offset(z,iso='2026-10-27T12:00:00Z'){return new Intl.DateTimeFormat('en-GB',{timeZone:z,timeZoneName:'longOffset'}).formatToParts(new Date(iso)).find(x=>x.type==='timeZoneName').value.replace('GMT','UTC')}
function label(z){return `${short(z)} · ${z}`}
function localDate(iso,z){return new Intl.DateTimeFormat('en-CA',{timeZone:z,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso))}
function fmt(iso,z){return new Intl.DateTimeFormat('sv-SE',{timeZone:z,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(iso))+' '+offset(z,iso)}
function midnight(date,z){const [y,m,d]=date.split('-').map(Number),target=Date.UTC(y,m-1,d);let t=target;for(let i=0;i<5;i++){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:z,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(t)).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));const delta=target-Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);t+=delta;if(!delta)break}return t}
function bounds(date,z){const n=new Date(date+'T12:00:00Z');n.setUTCDate(n.getUTCDate()+1);const next=n.toISOString().slice(0,10);return {start:midnight(date,z),end:midnight(next,z)}}
function rangeText(date,z){const b=bounds(date,z);return `${new Date(b.start).toISOString().replace('.000','')} ≤ 事件时间 ＜ ${new Date(b.end).toISOString().replace('.000','')}<br>本地自然日长度：${(b.end-b.start)/3600000} 小时`}
function matched(date,z){const b=bounds(date,z);return records.filter(r=>Date.parse(r.utc)>=b.start&&Date.parse(r.utc)<b.end)}
function choose(key,text){return `<button data-zone="${key}" aria-label="${esc(text)}">${esc(text)}：${esc(short(state[key]))} ▾</button>`}
function intro(n,title,desc){return `<div class="page-intro"><div class="tagline">${n} / TIMEZONE PLANNING</div><h1>${title}</h1><p class="lead muted">${desc}</p></div>`}
function table(head,rows,cls=''){return `<div class="table-wrap"><table class="${cls}"><thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function flow(steps){return `<div class="flow">${steps.map((s,i)=>(i?'<div class="flow-arrow" aria-hidden="true">→</div>':'')+`<div class="step"><b>${s[0]}</b><span class="small muted">${s[1]}</span></div>`).join('')}</div>`}
const nodeDetails={
 org:['组织默认','管理员设置；初始为 Asia/Shanghai。为未配置的个人偏好和新业务配置提供兜底。','改默认仅影响后续初始化；已有共享视图、日历、历史导出保留自身时区。','settings'],
 team:['团队运营默认','建议新增；美西团队可设置 America/Los_Angeles。创建团队共享视图或工作日历时，带入建议值。','带入后随业务对象保存。切换团队或修改团队默认，不静默改写已有规则；多团队成员不靠“当前浏览团队”决定日额度。','settings'],
 personal:['个人显示时区','坐席自己的偏好，初始北京时间。统一展示工单列表、消息详情和操作记录的时间。','改变钟表上的日期和时刻；不改变同一工单视图的匹配集合、消息排序依据、SLA 剩余时长、既定排班或每日额度。','desk'],
 report:['报表统计时区','报表页一个统一入口；默认我的报表偏好，未设则北京时间。日期条件按所选时区解释。','切换后重查并重算汇总、趋势、分组、对比、下钻与明细。跨团队汇总也采用一个共同统计时区。','reports'],
 rule:['共享视图规则时区','编辑视图时保存；新建可带入所属团队默认。“今天/昨天”每次按规则时区展开。','两名坐席的个人显示时区可以不同，但打开同一共享视图应得到相同工单集合。改规则时区需确认影响，并以新规则重新查询。','desk'],
 calendar:['日历／计划执行时区','工作日历、SLA 工作时间和明确时间的触达计划，分别保存执行时区。已有日历能力可复用。','“每周一 09:00”在该日历时区执行；个人切换显示只换算预览。修改执行时区属于业务配置变更，需要独立生效策略。','execution'],
 quota:['每日额度业务日时区','按额度策略归属确定，而不是按谁正在查看确定。现有邮件额度解析为北京时间。','决定何时换日、清点哪天的回复量以及是否还能分单。多团队额度归属未定，本版先保留组织／坐席策略级北京口径。','execution'],
 source:['店铺／渠道源时区','用于核对源平台的时间语义。只有确认过平台实际配置才记录，不能由国家或团队位置推断。','源字段含 offset 时按 offset 解析。更换“源时区”可能影响无 offset 数据解析，不能作为改显示的捷径；不批量平移历史时间。','desk']
};
function node(id,title,sub){return `<button class="node" data-node="${id}" aria-pressed="${state.node===id}"><strong>${title}</strong><span class="muted">${sub}</span></button>`}
function mapPage(){return intro('01','时区在哪里设置，分别影响什么','统一设置入口和时区字典；个人显示、统计查询、共享规则与业务执行各自有明确归属。点击图中节点查看影响。')+`<div class="diagram"><div class="caption">关系图 · 箭头表示“提供初值”或“实际作用于”；每个对象一旦保存，就使用自己的时区。</div><div class="root-node">${node('org','组织默认 · '+short(state.org),'未配置时兜底；不追溯覆盖旧配置')}</div><div class="arrow">↓ <span>提供初始默认；团队可另设运营默认</span></div><div class="grid3"><div class="lane"><div class="lane-label">个人偏好 · 我自己看</div>${node('personal','个人显示时区','工单、消息、操作日志的时刻')}<div class="arrow">↓</div><div class="sink"><b>只转换展示</b>同一事件、排序依据与剩余秒数不变</div></div><div class="lane"><div class="lane-label">查询口径 · 这次查什么</div>${node('report','报表统计时区','默认个人报表偏好，可临时切换')}<div class="arrow">↓</div><div class="sink"><b>重算数据集合与统计</b>汇总 → 图表 → 下钻 → 导出任务</div></div><div class="lane"><div class="lane-label">团队运营 · 大家按什么工作</div>${node('team','团队运营默认','建议新增；给新配置带入初值')}<div class="arrow">↓ <span>创建时带入，分别保存</span></div>${node('rule','共享视图规则时区','决定分单视图“今天”是哪一天')}${node('calendar','日历／计划执行时区','决定工作窗口、SLA 与计划时刻')}</div></div><div class="grid2" style="margin-top:20px"><div>${node('quota','每日额度业务日时区','独立额度策略；团队归属待决策')}</div><div>${node('source','店铺／渠道源时区','源时间核对与解析语义，不跟随团队')}</div></div><div class="diagram-footer"><b>共用基础：</b>同一事件保存可追溯的 UTC 时间点；所有入口复用 IANA 时区字典、按事件日期处理夏令时。组织、团队、个人时区不改变原始事实。</div></div><div class="detail" id="node-detail" aria-live="polite"></div><div class="row" style="margin-top:18px"><a href="#/impact">查看完整影响清单 →</a><a href="#/settings">查看设置入口原型 →</a></div>`}

function impactPage(){const selected=state.matrix;const cats=[['all','全部板块'],['personal','个人显示'],['rule','筛选规则'],['report','报表导出'],['calendar','业务执行'],['quota','每日额度'],['source','来源时间'],['base','数据基础']];return intro('02','受影响板块：在哪里显示，在哪里选择','“有时间”不等于“都加一个筛选框”。展示处标口径；只有查询或配置归属变化的入口，才需要可编辑时区。')+`<div class="tabs row">${cats.map(([k,t])=>`<button data-matrix="${k}" aria-pressed="${selected===k}">${t}</button>`).join('')}</div><div class="panel tight">${table(['板块／页面','采用哪个时区','切换后要发生什么','核验范围／原型'],impacts.filter(x=>selected==='all'||x[1]===selected).map(x=>[x[0],x[2],x[3],`<span class="badge ${x[4]==='代码核验'?'checked':'pending'}">${x[4]}</span><br><a href="#/${x[5]}">查看业务原型 →</a>`]),'matrix')}</div><p class="small muted">核验依据：2026-10-28 的相关仓库代码快照。代码核验不等于确认环境已部署；“部分核验”表示关联能力有证据，尚未穷尽该板块所有入口。</p>`}
function settingsPage(){return intro('03','统一入口，分清设置的归属','建议在设置中集中解释和管理时区。普通坐席只编辑个人偏好；管理员编辑组织、团队和业务对象配置。这里为演示切换，无线上保存。')+`<div class="panel"><h2>我的偏好 <span class="badge proposed">建议新增</span></h2><div class="setting-row"><div><b>个人显示时区</b><div class="settings-help">只影响我看到的工单与日志时间</div></div><div class="value">${label(state.personal)}</div>${choose('personal','设置个人显示')}</div><div class="setting-row"><div><b>我的报表默认时区</b><div class="settings-help">打开报表时带入；页面允许临时覆盖</div></div><div class="value">${label(state.reportDefault)}</div>${choose('reportDefault','设置报表默认')}</div><div class="notice small">两项初始均为北京时间。修改个人显示不自动改报表统计，也不改共享视图和排班。报表页始终明确显示自己的统计时区。</div></div><div class="panel"><h2>组织与团队 <span class="badge proposed">管理员配置建议</span></h2><div class="setting-row"><div><b>组织默认</b><div class="settings-help">初始北京；供未配置项初始化</div></div><div class="value">${label(state.org)}</div>${choose('org','设置组织默认')}</div><div class="setting-row"><div><b>美西团队 · 运营默认</b><div class="settings-help">新建视图／日历时建议带入</div></div><div class="value">${label(state.team)}</div>${choose('team','设置团队默认')}</div><p class="small muted">团队默认初始继承组织；此示例美西团队已单独配置洛杉矶。默认修改后，已有对象保持已保存值，不级联改写。</p></div><div class="panel"><h2>业务对象保存自己的时区</h2>${table(['对象','已保存时区／口径','操作入口'],[['共享分单视图',label(state.rule),'<a href="#/desk">进入视图编辑 →</a>'],['工作日历',label(state.calendar),'<a href="#/execution">进入日历配置 →</a>'],['每日邮件额度策略',label(state.quota)+'；多团队归属待定','<a href="#/execution">查看额度边界 →</a>'],['店铺／渠道来源时间','须核实平台配置；不是按团队自动推断','<a href="#/desk">查看平台时间对照 →</a>']])}</div><div class="notice small">选择控件沿用现有工作日历的“可搜索时区下拉”交互。生产方案共用完整 IANA 字典；原型用浏览器支持列表演示“常用＋更多时区”，不是只支持几个固定地区。偏移量取决于事件日期。</div>`}
function deskPage(){const set=matched('2026-10-27',state.rule);return intro('04','同一个共享分单视图，不因查看人而漏筛','先看规则时区，再看我的显示时区。下方是固定日期的业务演示；不是两封反馈邮件的真实查询结果。')+`<div class="panel"><div class="row spread"><h2 style="margin:0">美西团队 · 待回复时间分单视图</h2><span class="badge proposed">共享规则</span></div><div class="strip"><div class="row spread"><div><b>筛选字段：</b>最早待回复消息时间<br><b>本地范围：</b>2026-10-27 00:00 至 2026-10-28 00:00（不含）<br><b>规则时区：</b>${label(state.rule)}</div><button data-zone="rule">编辑共享规则时区</button></div></div><div class="boundary">${rangeText('2026-10-27',state.rule)}</div><div class="row spread" style="margin:18px 0">${choose('personal','我的显示时区')}<b class="same">当前匹配 ${set.length} 张 · ${set.map(x=>x.id).join('、')||'无'}</b></div>${table(['演示工单','最早待回复消息时间 · 我的显示','UTC 事实时间'],set.map(r=>[`<span class="ticket-id">${r.id}</span>`,fmt(r.utc,state.personal),`<code>${r.utc}</code>`]))}<div class="notice good small">切换“我的显示时区”后，上方工单 ID 集合保持一致。只有修改已保存的共享规则时区，才重新计算筛选集合。</div></div><div class="grid2"><div class="panel"><h2>协作业务图</h2>${flow([['保存视图','字段＋本地范围／相对日期＋规则时区'],['按规则查 UTC','所有查看人共用一个查询范围'],['各自换算显示','北京与美西坐席看到同一批工单']])}<p class="small muted">“今天／昨天”按规则时区在每次执行时计算；固定区间保留固定事实范围。旧 epoch 视图迁移不平移。</p></div><div class="panel"><h2>来源平台对照：只比较同一时间点</h2><p class="small muted">以来源实际为洛杉矶为前提，演示反馈中的两组时刻关系。来源时区尚未核实，不能据此判定根因。</p>${table(['UTC 示例','洛杉矶','北京'],records.slice(0,2).map(r=>[`<code>${r.utc}</code>`,fmt(r.utc,LA),fmt(r.utc,BEIJING)]))}<p class="small">来源时间、消息发生时间和入库时间分别保留。倒计时一致，也不能替代筛选范围核验。</p></div></div><div class="decision"><b>临时查询：</b>时间范围旁显示“查询时区”，默认个人偏好，可临时覆盖；保存为共享视图时明确保存规则时区。已有共享视图不会随查看人的偏好变化。</div>`}
function reportPage(){const set=matched(state.reportDate,state.report),hist=[0,0,0,0];set.forEach(r=>{const h=+new Intl.DateTimeFormat('en-GB',{timeZone:state.report,hour:'2-digit',hourCycle:'h23'}).format(new Date(r.utc));hist[Math.min(3,Math.floor(h/6))]++});return intro('05','页面统计与导出共用口径，临时导出可覆盖','切换统计时区会改变自然日对应的事件集合。不能只改横轴标签、Excel 时间列或平移已有北京日报。')+`<div class="panel"><div class="row spread"><h2 style="margin:0">绩效报表 · 4 条消息样本</h2><button class="primary" data-action="open-export">导出…</button></div><div class="row" style="margin:18px 0"><label>统计日期 <input id="report-date" type="date" value="${state.reportDate}"></label>${choose('report','统计时区')}<span class="small muted">初始来自我的报表默认；当前为本页临时选择</span></div><div class="boundary">${rangeText(state.reportDate,state.report)}</div><div class="grid2"><div class="split-stat"><div class="small muted">本地自然日内的样本消息数</div><div class="number">${set.length}<span class="small"> / 4 条样本</span></div><div class="small">${set.map(r=>r.id).join('、')||'固定样本没有覆盖该日期'}</div></div><div class="split-stat"><div class="small muted">按统计时区每 6 小时分组 · 与下钻同源</div><div class="mini-bars">${hist.map((n,i)=>`<div class="bar-col"><span>${n} 条</span><div class="bar" style="height:${n*21+3}px"></div><span>${String(i*6).padStart(2,'0')}–${String((i+1)*6).padStart(2,'0')}</span></div>`).join('')}</div></div></div><h3 style="margin-top:22px">明细／下钻 · ${label(state.report)}</h3>${table(['样本 ID','消息时间 · 统计时区','UTC 事实时间'],set.map(r=>[r.id,fmt(r.utc,state.report),`<code>${r.utc}</code>`]))}<p class="small muted">全部为演示数据，只用于解释跨日归属。此处未连接真实报表接口，样本计数不是线上业绩。</p></div><div class="panel"><h2>导出业务流程</h2>${flow([['点击导出','打开确认层，默认继承页面统计时区'],['看清并确认','可选其他时区；重算该时区日期范围与样本'],['手动提交任务','冻结统计时区、日期、筛选与数据版本'],['下载同一份结果','等待期间切换页面时区，不改变已提交任务']])}<div class="notice small">本版建议：每次导出保留一个简短确认层，默认时区也需手动确认。非页面时区时突出差异；没有自动提交、自动关闭或倒计时。该确认方案是本次产品建议。</div></div><div class="panel"><h2>导出任务记录 <span class="badge">原型内模拟</span></h2>${state.exports.length?table(['任务','冻结日期／时区','冻结样本数','操作'],state.ex function executionPage(){return intro('06','执行规则用自己的时区，显示可以换算','复用已有工作日历。日历／计划的执行时区和看班表的显示时区要分开；每日额度另外定义业务日。')+`<div class="panel"><h2>工作日历 · 美西客服 <span class="badge checked">已有时区能力，交互示意</span></h2><div class="grid2"><div><div class="line-node"><b>日历执行时区</b><br>${label(state.calendar)}<br><span class="small">每周一至周五 · 09:00–17:00<br>节假日使用日历本地日期</span></div><div class="row"><button data-zone="calendarDraft">申请修改日历执行时区</button>${choose('personal','预览显示时区')}</div></div><div><b>同一班次在个人时区中的预览</b><p class="small muted">2026-10-27 日历当地 09:00–17:00</p><div class="boundary">${fmt(new Date(midnight('2026-10-27',state.calendar)+9*3600000).toISOString(),state.personal)}<br>至 ${fmt(new Date(midnight('2026-10-27',state.calendar)+17*3600000).toISOString(),state.personal)}</div><p class="small">预览切换只改变上面两行时间。日历仍按 ${short(state.calendar)} 09:00 开始。</p></div></div>${state.calendarDraft?`<div class="decision"><b>待确认变更：</b>${label(state.calendar)} → ${label(state.calendarDraft)}<br>按“当地 09:00–17:00”保留钟点，实际 UTC 工作窗口将改变。<br><b>本原型采用：</b>新版本于 2026-11-02 00:00（旧日历时区）起用于新建业务；此前已承诺的 SLA 截止不重算。存量／循环计划逐一检查，未经迁移继续旧版本。<div class="row" style="margin-top:12px"><button data-action="cancel-calendar">取消</button><button class="primary" data-action="save-calendar">确认生成日历新版本（演示）</button></div></div>`:''}<p class="small muted">当前生效版本 v${state.calendarVersion}。${state.pendingCalendar?'已生成待生效 v'+state.pendingCalendar.version+'，时区 '+label(state.pendingCalendar.zone)+'；于 '+state.pendingCalendar.effective+'（'+short(state.pendingCalendar.effectiveZone)+'）用于新业务，当前预览仍使用旧版本。':''}上方是工作日历预览，不代表已核验完整人员轮班功能。触达计划采用同类独立时区原则，具体能力覆盖待核验。</p></div><div class="panel"><h2>日历规则如何影响业务</h2>${flow([['日历与假日','时区＋周工作窗口＋当地假日'],['绑定业务对象','团队／分单条件／SLA 日历／计划'],['按规则计算执行','判断是否营业、累计工作时长、生成截止时间'],['查看时换算','显示本地截止时刻；个人切换不改剩余秒数']])}<p class="small">修改日历执行时区会改变实际业务窗口，需要独立确认与生效版本；并非个人偏好设置。</p></div><div class="grid2"><div class="panel"><h2>每日邮件额度 · 独立业务日</h2><div class="strip"><b>本期保留：</b>${label(state.quota)}<br><span class="small">组织／坐席策略级 function renderExport(){const e=exportDraft,set=matched(e.date,e.zone),different=e.zone!==e.pageZone;$('export-content').innerHTML=`<p><b>统计日期：</b>${e.date}<br><b>页面统计时区：</b>${label(e.pageZone)}</p><div class="row"><button data-zone="export">本次导出时区：${short(e.zone)} ▾</button></div><div class="notice ${different?'warn':''}">${different?'<b>与页面统计时区不同。</b>将按下列导出时区重新计算日期范围与数据，而不是仅转换时间列。':'将沿用页面统计时区。请确认日期与时区后生成。'}</div><b>${label(e.zone)}</b><div class="boundary">${rangeText(e.date,e.zone)}</div><p><b>重算后的样本：</b>${set.length} 条 · ${set.map(x=>x.id).join('、')||'无样本'}</p><p class="small muted">确认后冻结：统计日期、统计时区、UTC 范围、筛选（全部团队／邮件样本）、样本版本 demo-v1。此演示立即生成记录；真实系统可异步处理。弹窗不会自动提交或自动消失。</p>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.node){state.node=b.dataset.node;renderDetail()}if(b.dataset.matrix){state.matrix=b.dataset.matrix;render()}if(b.dataset.zone)openZone(b.dataset.zone);if(b.dataset.pickZone){zoneDraft=b.dataset.pickZone;renderZoneList()}if(b.dataset.download!==undefined){const task=state.exports[+b.dataset.download];const csv='\uFEFF'+[['统计日期',task.date],['统计时区',task.zone],['UTC开始',new Date(task.start).toISOString()],['UTC结束（不含）',new Date(task.end).toISOString()],['样本版本','demo-v1'],[],['演示消息ID','统计时区本地时间','UTC事实时间'],...task.rows.map(r=>[r.id,fmt(r.utc,task.zone),r.utc])].map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`演示导出_${task.date}_${task.zone.replaceAll('/','-')}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
switch(b.dataset.action){case'more-zones':zoneMore=true;renderZoneList();break;case'close-zone':$('zone-dialog').close();break;case'apply-zone':$('zone-dialog').close();if(zoneKey==='export'){exportDraft.zone=zoneDraft;renderExport()}else if(zoneKey==='rule'&&zoneDraft!==state.rule){pendingRule=zoneDraft;const old=matched('2026-10-27',state.rule),next=matched('2026-10-27',pendingRule);$('rule-content').innerHTML=`<p>日期仍为 2026-10-27，规则时区从<br><b>${label(state.rule)}</b><br>改为<br><b>${label(pendingRule)}</b>。</p><div class="notice warn">这会影响所有使用该共享视图的同事，不只是你的显示。</div><p>修改前匹配：${old.map(r=>r.id).join('、')||'无'}<br>修改后匹配：${next.map(r=>r.id).join('、')||'无'}</p><p class="small">确认后保存新规则并重新查询；不修改工单原始时间。</p>`;$('rule-dialog').showModal()}else{state[zoneKey]=zoneDraft;render()}break;case'confirm-rule':state.rule=pendingRule;pendingRule=null;$('rule-dialog').close();render();break;case'cancel-rule':pendingRule=null;$('rule-dialog').close();break;case'open-export':exportDraft={date:state.reportDate,pageZone:state.report,zone:state.report};renderExport();$('export-dialog').showModal();break;case'close-export':$('export-dialog').close();exportDraft=null;break;case'confirm-export':if(exportDraft){const b=bounds(exportDraft.date,exportDraft.zone);state.exports.push({...exportDraft,...b,rows:matched(exportDraft.date,exportDraft.zone).map(r=>({...r}))});exportDraft=null;$('export-dialog').close();render()}break;case'cancel-calendar':state.calendarDraft=null;render();break;case'save-calendar':state.pendingCalendar={zone:state.calendarDraft,version:state.calendarVersion+1,effective:'2026-11-02 00:00',effectiveZone:state.calendar};state.calendarDraft=null;render();break;}});
document.addEventListener('input',e=>{if(e.target.id==='zone-search')renderZoneList()});
document.addEventListener('change',e=>{if(e.target.id==='report-date'){if(e.target.value&&/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){state.reportDate=e.target.value;render()}}});
$('export-dialog').addEventListener('cancel',()=>{exportDraft=null});
let lastRoute=current();window.addEventListener('hashchange',()=>{const next=current();if(next==='reports'&&lastRoute!=='reports')state.report=state.reportDefault;lastRoute=next;render();window.scrollTo(0,0)});render();
</script>
</body></html>
