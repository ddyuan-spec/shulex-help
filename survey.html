function switchHTML(checked,label,action){return `<button type="button" role="switch" aria-checked="${checked}" aria-label="${esc(label)}" class="switch" onclick="${action}"></button>`}
function toast(msg){clearTimeout(toastTimer);document.getElementById('toastroot').innerHTML=`<div class="toast"><span class="checkcircle">✓</span>${esc(msg)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toastroot').innerHTML='',2800)}
function scopeToast(){toast('此原型聚焦满意度调查与相关触发器，可从左侧切换查看')}
function go(p){page=p;draft=null;document.getElementById('overlay').innerHTML='';history.replaceState(null,'','#/'+p);render()}
function render(){document.getElementById('nav-survey').classList.toggle('active',page!=='triggers');document.getElementById('nav-trigger').classList.toggle('active',page==='triggers');if(page==='editor')renderEditor();else if(page==='triggers')renderTriggers();else renderList();hydrate()}
function renderList(){const enabled=state.surveys.some(s=>s.enabled);document.getElementById('main').innerHTML=`<div class="pageheader"><h1>满意度调查</h1><button class="btn primarybtn" onclick="editSurvey(null)">${icon('plus')}新建问卷</button></div><section class="defaultsetting"><div><div class="settingtitle">关单后自动发送邀评邮件 <span class="infotip" tabindex="0" aria-label="关单自动邀评说明">${icon('info')}<span class="tip">仅控制当前租户的系统默认关单邮件邀评。关闭后不改变问卷启用状态，主动触达和自定义触发器仍可使用已启用问卷；已有触发器仍按自身条件执行。LiveChat 弹窗由触发器单独控制。</span></span></div><div class="settingdesc">${state.auto?'邮件工单解决后，系统自动发送已启用的问卷。主动触达和触发器独立配置。':'已关闭关单自动邀评。问卷仍可用于主动触达和触发器发送。'}</div></div><div class="settingcontrol"><div class="statecaption">${state.auto?'已开启':'已关闭'}<small>仅系统默认邮件</small></div>${switchHTML(state.auto,'关单后自动发送邀评邮件','toggleAuto()')}</div></section>${!enabled?`<div class="infobar">${icon('info')}当前没有启用的问卷，关单自动邀评、主动触达和触发器暂不能使用普通问卷。请先启用所需问卷；关单自动邀评设置仍保留。</div>`:''}<div class="toolbar"><label class="search">${icon('search')}<input id="surveySearch" placeholder="搜索问卷名称" aria-label="搜索问卷名称" oninput="filterSurveys(this.value)"></label></div><div class="tablewrap"><table class="table"><colgroup><col><col style="width:140px"><col style="width:115px"><col style="width:170px"><col style="width:95px"><col style="width:150px"></colgroup><thead><tr><th>问卷名称</th><th>规则类型</th><th>状态</th><th>更新时间</th><th><span>问卷启用</span></th><th>操作</th></tr></thead><tbody id="surveyRows">${surveyRows('')}</tbody></table><div id="searchEmpty" class="empty hidden">未找到相关问卷</div></div>`}
function surveyRows(search){return state.surveys.filter(s=>s.name.toLowerCase().includes(search.toLowerCase())).map(s=>`<tr><td><div class="name">${esc(s.name)}</div><div class="meta">${s.count} 个问题</div></td><td>触发器</td><td><span class="tag ${s.enabled?'enabled':''}">${s.enabled?'启用':'禁用'}</span></td><td>${s.date}</td><td>${switchHTML(s.enabled,s.name+' 启用',`toggleSurvey(${s.id})`)}</td><td><div class="actions"><button class="iconbtn" aria-label="编辑 ${esc(s.name)}" title="编辑" onclick="editSurvey(${s.id})">${icon('edit')}</button><button class="iconbtn" aria-label="复制 ${esc(s.name)}" title="复制" onclick="copySurvey(${s.id})">${icon('copy')}</button><button class="iconbtn delete" aria-label="删除 ${esc(s.name)}" title="删除" onclick="deleteSurvey(${s.id})">${icon('trash')}</button></div></td></tr>`).join('')}
function filterSurveys(v){document.getElementById('surveyRows').innerHTML=surveyRows(v);document.getElementById('searchEmpty').classList.toggle('hidden',document.getElementById('surveyRows').children.length>0)}
function toggleAuto(){state.auto=!state.auto;persist();renderList();toast(state.auto?'已开启关单自动邀评':'已关闭关单自动邀评，触发器与主动触达仍可使用问卷')}
function toggleSurvey(id){const s=state.surveys.find(s=>s.id===id);s.enabled=!s.enabled;persist();renderList();toast(s.enabled?'问卷已启用，关单自动邀评设置保持不变':'问卷已禁用，关单自动邀评设置保持不变')}
function copySurvey(id){const s=state.surveys.find(s=>s.id===id);const copy={...structuredClone(s),id:Date.now(),name:s.name+' Copy',enabled:false,date:'2026-10-29 14:30'};state.surveys.unshift(copy);persist();renderList();toast('已复制问卷，副本默认为禁用')}
function deleteSurvey(id){const s=state.surveys.find(s=>s.id===id);modal('删除问卷',`确定删除「${esc(s.name)}」？删除后将无法选择该问卷。`,'删除',()=>{state.surveys=state.surveys.filter(s=>s.id!==id);persist();closeModal();renderList();toast('问卷已删除')},true)}
function editSurvey(id){draft=id?structuredClone(state.surveys.find(s=>s.id===id)):{id:null,name:'',count:1,enabled:false,validity:'UNLIMITED',days:30,questions:['您对本次服务的整体体验是否满意？']};draft.questions=draft.questions||['您对本次服务的整体体验是否满意？','问题是否得到解决？','您对处理效率是否满意？','还有什么建议告诉我们？'].slice(0,draft.count);draft.subject=draft.subject||'How was your support experience?';draft.body=draft.body||'Thank you for contacting us. We would love to hear your feedback about your recent support experience.';page='editor';step=1;render()}
function stepBar(){return `<div class="steps">${['配置基本信息','邮件内容','问卷内容'].map((x,i)=>`${i?'<span class="stepdivider"></span>':''}<div class="step ${step===i+1?'active':''} ${step>i+1?'done':''}" role="button" tabindex="0" onclick="changeStep(${i+1})" onkeydown="if(event.key==='Enter')changeStep(${i+1})"><span class="num">${step>i+1?'✓':i+1}</span>${x}</div>`).join('')}</div>`}
function renderEditor(){document.getElementById('main').innerHTML=`<div class="pageheader"><h1><button class="back" aria-label="返回满意度调查" onclick="cancelEdit()">${icon('back')}</button>${draft.id?'编辑':'新建'}满意度调查问卷</h1></div><div class="editorbody">${stepBar()}${step===1?basicEditor():composeEditor()}</div><div class="editorfooter"><span class="muted">${step>1?'内容修改后需保存生效':''}</span><div class="footerright">${step>1?'<button class="btn" onclick="changeStep(step-1)">上一步</button>':''}<button class="btn" onclick="cancelEdit()">取消</button>${step<3?'<button class="btn primarybtn" onclick="changeStep(step+1)">下一步</button>':'<button class="btn primarybtn" onclick="saveSurvey()">保存</button>'}</div></div>`}
function basicEditor(){return `<div class="basicform"><div class="field"><label class="fieldlabel required" for="surveyName">问卷名称</label><input class="input" id="surveyName" value="${esc(draft.name)}" placeholder="请输入问卷名称" oninput="draft.name=this.value"></div><div class="field"><label class="fieldlabel required" for="ruleType">规则类型</label><select class="select" id="ruleType"><option>触发器</option></select></div><div class="field"><label class="fieldlabel required" for="validityDays">链接有效期</label><div class="validity"><input class="input" id="validityDays" type="number" min="1" max="365" ${draft.validity==='UNLIMITED'?'disabled':''} value="${draft.validity==='UNLIMITED'?'':draft.days}" oninput="draft.days=Number(this.value)"><select class="select" aria-label="链接有效期单位" onchange="draft.validity=this.value;renderEditor()"><option value="UNLIMITED" ${draft.validity==='UNLIMITED'?'selected':''}>永不过期</option><option value="DAY" ${draft.validity==='DAY'?'selected':''}>天</option></select></div><div class="hint">从链接生成时开始计算，修改后仅影响新生成的链接。</div></div></div>`}
function composeEditor(){const isMail=step===2;return `<div class="compose"><div class="composeform"><div class="smallheading">${isMail?'邮件内容':'问卷内容'}<span style="float:right;font-size:12px;font-weight:400;color:#8c95a1">${icon('globe')} 默认语言</span></div>${isMail?`<div class="field"><label class="fieldlabel required">邮件主题</label><input class="input" value="${esc(draft.subject)}" oninput="draft.subject=this.value;document.getElementById('previewSubject').textContent=this.value"></div><div class="field"><label class="fieldlabel required">邮件正文</label><textarea class="textarea" oninput="draft.body=this.value;document.getElementById('previewBody').textContent=this.value">${esc(draft.body)}</textarea></div><div class="field"><label class="fieldlabel">问卷按钮文案</label><input class="input" value="Share your feedback"></div>`:`<div class="editorwarning">问卷内容保存后生成新版本，已发送链接保留原问卷内容。</div>${draft.questions.map((q,i)=>`<div class="qcard"><div class="qhead"><span>问题 ${i+1} · ${i===draft.questions.length-1&&i>1?'文本':'满意度评分'}</span><span class="muted">${i===0?'必填':'选填'}</span></div><div class="qbody"><input class="input" aria-label="问题 ${i+1}" value="${esc(q)}" oninput="draft.questions[${i}]=this.value"><div class="radiorow">${i===draft.questions.length-1&&i>1?'多行文本回答':'☆　☆　☆　☆　☆'}</div></div></div>`).join('')}<button class="btn" onclick="draft.questions.push('请输入问题');renderEditor()">${icon('plus')}添加问题</button>`}</div><aside class="preview"><div class="previewlabel">${icon('eye')} ${isMail?'邮件预览':'问卷预览'}</div><div class="emailcard"><div style="font-size:18px;font-weight:600;letter-spacing:-.6px">solvea.</div><h3 id="previewSubject">${isMail?esc(draft.subject):'Customer Satisfaction Survey'}</h3><p id="previewBody">${isMail?esc(draft.body):esc(draft.questions[0])}</p>${isMail?'<button class="btn" onclick="toast(\'问卷链接预览，无实际发送\')">Share your feedback</button>':'<div class="previewstars">☆☆☆☆☆</div>'}<p style="font-size:11px;margin-top:28px;color:#a0a7b1">Powered by solvea.</p></div></aside></div>`}
function changeStep(next){if(!draft.name.trim()){toast('请填写问卷名称');document.getElementById('surveyName')?.focus();return}if(draft.validity!=='UNLIMITED'&&(!draft.days||draft.days<1||draft.days>365)){toast('链接有效期请输入 1 至 365 天');return}step=next;renderEditor()}
function saveSurvey(){if(!draft.name.trim()){step=1;renderEditor();toast('请填写问卷名称');return}draft.count=draft.questions.length;draft.date='2026-10-29 14:30';if(draft.id){state.surveys[state.surveys.findIndex(s=>s.id===draft.id)]=draft}else{draft.id=Date.now();state.surveys.unshift(draft)}persist();go('surveys');toast('问卷已保存，关单自动邀评设置保持不变')}
function cancelEdit(){go('surveys')}
function renderTriggers(){document.getElementById('main').innerHTML=`<div class="pageheader"><h1>触发器</h1><div class="toolgroup"><button class="btn" onclick="toast('已展示本原型涉及的满意度规则')">管理分类</button><button class="btn primarybtn" onclick="newRule()">${icon('plus')}新建触发器</button></div></div><div class="triggernotice">${icon('info')}普通触发器可新增、停用或删除。系统默认关单邮件邀评：<span class="tag ${state.auto?'enabled':''}">${state.auto?'开启':'关闭'}</span><a href="#/surveys" onclick="event.preventDefault();go('surveys')">前往满意度调查设置 ›</a></div><div class="toolbar"><label class="search">${icon('search')}<input placeholder="搜索触发器名称" aria-label="搜索触发器名称" oninput="filterRules(this.value)"></label><span class="chip">全部分类⌄</span></div><div class="rulelist" id="rules">${rulesHTML('')}</div>`}
function rulesHTML(q){return state.rules.filter(r=>r.name.toLowerCase().includes(q.toLowerCase())).map((r,i)=>`<div class="ruleline"><span class="ruleindex">${i+1}</span><div><div class="title" onclick="editRule(${r.id})">${esc(r.name)}</div><div class="description">未分类 </div><div class="conditions">工单状态是已解决；渠道是${esc(r.channel)}</div><div class="description">${r.native?'向访客发送 LiveChat 满意度弹窗':'发送问卷：'+esc(state.surveys.find(s=>s.id===r.template)?.name||'未选择问卷')}</div></div><div class="end">${switchHTML(r.enabled,r.name+' 启用',`toggleRule(${r.id})`)}<button class="iconbtn" aria-label="编辑规则 ${esc(r.name)}" onclick="editRule(${r.id})">${icon('edit')}</button><button class="iconbtn delete" aria-label="删除规则 ${esc(r.name)}" title="删除" onclick="deleteRule(${r.id})">${icon('trash')}</button></div></div>`).join('')||'<div class="empty">暂无相关触发器，可点击右上角“新建触发器”添加。<div class="hint">删除规则不会自动补回，也不会改变关单自动邀评设置。</div></div>'}
function filterRules(q){document.getElementById('rules').innerHTML=rulesHTML(q)}
function toggleRule(id){const r=state.rules.find(r=>r.id===id);r.enabled=!r.enabled;persist();renderTriggers();toast(r.enabled?'触发器已启用':'触发器已关闭，关单自动邀评设置保持不变')}
function newRule(){ruleDraft={id:null,name:'',native:false,enabled:false,once:true,channel:'邮件',template:state.surveys[0]?.id};openRule()}
function editRule(id){ruleDraft=structuredClone(state.rules.find(r=>r.id===id));openRule()}
function openRule(){const r=ruleDraft;document.getElementById('overlay').innerHTML=`<div class="drawerbackdrop mask"><section class="drawer" role="dialog" aria-modal="true" aria-label="编辑触发器"><div class="drawerheader"><button class="iconbtn" aria-label="关闭触发器编辑" onclick="closeModal()">${icon('close')}</button>${r.id?'编辑':'新建'}触发器</div><div class="drawercontent"><div class="field"><label class="fieldlabel required">规则名称</label><input class="input" value="${esc(r.name)}" placeholder="请输入规则名称" oninput="ruleDraft.name=this.value"></div><div class="field" style="margin-bottom:12px"><label class="fieldlabel">分类</label><select class="select"><option>选择分类</option></select></div><div class="rulebox"><div class="boxtitle">满足以下所有条件</div><div class="boxhint">每一项都必须满足；留空表示不限制。</div><div class="conditionrow"><select class="select"><option>工单状态</option></select><select class="select"><option>是</option></select><select class="select"><option>已解决</option></select><button class="iconbtn" title="删除条件" onclick="toast('本原型保留关单邀评的必要条件')">${icon('trash')}</button></div><div class="conditionrow"><select class="select"><option>渠道</option></select><select class="select"><option>是</option></select><select class="select" aria-label="触发器渠道" onchange="ruleDraft.channel=this.value;ruleDraft.native=this.value==='LiveChat';openRule()"><option ${r.native?'selected':''}>LiveChat</option><option ${!r.native?'selected':''}>邮件</option></select><button class="iconbtn" title="删除条件" onclick="toast('请通过渠道下拉框切换邮件或 LiveChat')">${icon('trash')}</button></div><button class="btn" onclick="toast('本原型聚焦满意度动作，保留现有关单条件')">添加条件</button></div><div class="rulebox"><div class="boxtitle">满足以下任意条件</div><div class="boxhint">至少一项满足；留空表示不限制。</div><button class="btn" onclick="toast('本原型保留当前条件配置')">添加条件</button></div><div class="rulebox"><div class="boxtitle">执行动作</div><div class="boxhint">命中条件后，动作将按顺序执行。</div><div class="conditionrow"><select class="select" style="max-width:220px"><option>发送满意度问卷</option></select>${r.native?'<div class="actiondesc">向访客发送 LiveChat 满意度弹窗，无需选择问卷</div>':`<select class="select" aria-label="触发器发送问卷" onchange="ruleDraft.template=Number(this.value)">${state.surveys.map(s=>`<option value="${s.id}" ${s.id===r.template?'selected':''} ${!s.enabled?'disabled':''}>${esc(s.name)}${!s.enabled?'（已禁用）':''}</option>`).join('')}</select>`}<button class="iconbtn" title="删除动作" onclick="toast('本原型保留满意度发送动作')">${icon('trash')}</button></div><button class="btn" onclick="toast('本原型聚焦满意度发送动作')">添加动作</button>${!r.native?'<div class="nativehint">显式规则发送不受“关单自动邀评”开关影响，所选问卷需保持启用。</div>':''}</div></div><div class="drawerfooter"><label class="checkboxline"><input type="checkbox" ${r.once?'checked':''} onchange="ruleDraft.once=this.checked">同一个工单多次满足条件时仅执行一次</label><div class="toolgroup"><button class="btn" onclick="previewRule()">预览匹配</button><button class="btn" onclick="closeModal()">取消</button><button class="btn primarybtn" onclick="saveRule()">保存</button></div></div></section></div>`}
function deleteRule(id){
 const r=state.rules.find(r=>r.id===id);if(!r)return;
 const defaultHint=state.auto?'系统默认关单邮件邀评仍开启，符合条件的邮件工单仍可能收到问卷。':'系统默认关单邮件邀评已关闭；没有其他匹配规则或主动触达时，不再通过这些入口发送。';
 modal('删除触发器？','将删除「'+esc(r.name)+'」。该规则删除后不自动恢复，后续不再由这条规则发起邀评。<br><br>'+defaultHint+'<br><br>不撤回已发送的问卷，不承诺取消已开始执行的动作。','删除',()=>{state.rules=state.rules.filter(item=>item.id!==id);persist();closeModal();renderTriggers();toast('触发器已删除，关单自动邀评设置保持不变')},true);
}
function saveRule(){if(!ruleDraft.name.trim()){toast('请填写规则名称');return}if(!ruleDraft.native&&!state.surveys.some(s=>s.id===ruleDraft.template&&s.enabled)){toast('请选择已启用的问卷');return}if(ruleDraft.id){state.rules[state.rules.findIndex(r=>r.id===ruleDraft.id)]=ruleDraft}else{ruleDraft.id=Date.now();state.rules.unshift(ruleDraft)}persist();closeModal();renderTriggers();toast('规则已保存，关单自动邀评设置保持不变')}
function previewRule(){toast(ruleDraft.native?'匹配后发送 LiveChat 弹窗，不受关单自动邀评开关影响':state.surveys.some(s=>s.id===ruleDraft.template&&s.enabled)?'所选问卷已启用，可由此规则显式发送':'所选问卷已禁用，需先启用问卷')}
function modal(title,body,confirm,callback,danger=false){document.getElementById('overlay').innerHTML=`<div class="modalbackdrop mask"><section class="modal" role="dialog" aria-modal="true"><h3>${title}</h3><p>${body}</p><div class="modalbuttons"><button class="btn" onclick="closeModal()">取消</button><button class="btn ${danger?'danger':'primarybtn'}" id="modalconfirm">${confirm}</button></div></section></div>`;document.getElementById('modalconfirm').onclick=callback}
function closeModal(){document.getElementById('overlay').innerHTML=''}
function showOutreachInfo(){modal('主动触达使用问卷','主动触达可在邮件内容中插入已启用问卷的链接。关闭“关单自动邀评”后仍可使用；结束主动触达任务也不会改变关单自动邀评设置。','查看问卷设置',()=>go('surveys'))}
function resetDemo(){state=initial();persist();go('surveys');toast('已恢复原型初始状态')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
page=location.hash.includes('triggers')?'triggers':'surveys';render();
</script>
</body></html>
