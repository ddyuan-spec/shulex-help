<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solvea</title>
<style>
:root{--navy:#141f2e;--paper:#f0f1f3;--line:#e6e8ec;--text:#182334;--muted:#667385;--blue:#4b6ee8}*{box-sizing:border-box}body{margin:0;font:13px/1.5 "Microsoft YaHei",sans-serif;color:var(--text);background:var(--paper)}button,input{font:inherit}button,a{cursor:pointer}a{text-decoration:none;color:inherit}button{border:1px solid var(--line);background:#fff;color:inherit;border-radius:6px;padding:6px 11px}button:disabled{cursor:default;color:#9299a5;background:#f6f7f8}.primary{background:var(--blue);color:white;border-color:var(--blue)}.top{height:44px;background:var(--navy);color:white;display:flex;align-items:center;padding:0 13px;gap:17px}.top b{font-size:20px;letter-spacing:-.03em}.top span:last-child{margin-left:auto}.shell{display:grid;grid-template-columns:158px minmax(0,1fr);height:calc(100vh - 44px);min-width:660px}.appnav{padding:9px;background:#eef0f2;border-right:1px solid var(--line)}.switch{width:100%;text-align:left;box-shadow:0 2px 5px #0e18231c;font-weight:700;margin-bottom:10px}.switch::after{content:'≡';float:right;color:var(--muted)}.appnav a,.appnav .navitem,.subnav a,.subnav .navitem{display:block;padding:7px 8px;border-radius:6px;margin:3px 0}.navitem{color:#566170}.appnav .active{background:#e1e4e8;font-weight:bold}.subnav .active{background:#fff;font-weight:bold}.switches{display:grid;margin-bottom:10px;gap:2px}.switches[hidden]{display:none}.workspace{display:flex;min-width:0;overflow:auto}.subnav{flex:0 0 154px;padding:10px;overflow:auto}.subnav h2{margin:5px 3px 12px;font-size:17px}.subnav h3{margin:12px 8px 5px;color:var(--muted);font-size:11px;font-weight:500}.subnav .active,.appnav .active{color:#172132}.content{flex:1;min-width:370px;background:#fff;margin:7px 7px 7px 0;border-radius:9px;overflow:auto;padding:15px}.wide{margin-left:7px}h1{font-size:20px;margin:0 0 14px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 7px}.toolbar{display:flex;gap:7px;align-items:center;margin-bottom:10px}.toolbar small{color:var(--muted)}.tabs{display:flex;gap:15px;border-bottom:1px solid var(--line);padding:0 0 9px;margin-bottom:14px}.tabs b{color:#3b61de}.hint{color:var(--muted);font-size:12px}.channelGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.channel{border:1px solid var(--line);border-radius:8px;padding:11px;min-height:90px;display:grid;grid-template-columns:30px 1fr;gap:6px 7px;align-items:start}.badge{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#eef2ff;color:#3c5cca;font-weight:bold}.channel small{display:block;color:var(--muted)}.channel p{grid-column:1/-1;color:var(--muted);font-size:12px;margin:0}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{background:#f6f7fa;font-weight:600}input{border:1px solid #dce0e7;padding:6px 9px;border-radius:6px;min-width:0}.state{color:#3b60cd}.team{color:#2d7163}
.desk{display:grid;grid-template-columns:154px 185px minmax(265px,1fr) 190px;width:100%;min-width:794px;overflow:auto}.tickets,.conversation,.detail{background:white;margin:7px 6px 7px 0;border-radius:8px;overflow:auto;min-width:0}.tickets>header,.conversation>header,.detail>header{border-bottom:1px solid var(--line);padding:10px}.tickets a{display:block;padding:10px;border-bottom:1px solid var(--line)}.tickets .active{background:#eef2ff}.tickets small{display:block;color:var(--muted)}.conversation{display:grid;grid-template-rows:auto minmax(125px,1fr) auto}.titleline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.titleline strong{flex:1}.titleline button{padding:3px 6px}.ticketmeta{color:var(--muted);margin-top:7px}.thread{padding:10px;overflow:auto}.msg{margin-bottom:12px}.msg span{color:var(--muted);font-size:11px}.msg p{border-radius:7px;background:#f0f1f4;padding:8px;margin:4px 0;max-width:85%;width:fit-content}.msg.ai p{background:#edf2ff}.review{border:1px solid #d9e0f5;background:#f6f8ff;padding:9px;border-radius:7px;margin:9px 0}.review button{margin:4px 5px 0 0}.reply{border-top:1px solid var(--line);padding:9px}.reply p{margin:0 0 6px}.reply textarea{width:100%;height:55px;border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical;font:inherit}.reply .actions{display:flex;justify-content:flex-end;gap:5px;margin-top:5px}.detail>section{padding:10px;border-bottom:1px solid var(--line)}.detail p{margin:4px 0;color:var(--muted)}.detail strong{color:var(--text)}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}.metric{background:#f6f7f9;padding:11px;border-radius:8px}.metric b{font-size:22px;display:block}.block{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;padding:12px}.block p{margin:0 0 9px}.splitbar{display:flex;height:10px;border-radius:6px;background:#c3d0fc;overflow:hidden;margin:9px 0}.splitbar i{width:70%;background:#496be3}
</style></head><body>
<header class="top"><b>solvea.</b><span id="sectionName"></span><span>智能伙伴</span></header><div class="shell"><aside class="appnav" id="appnav"></aside><main class="workspace" id="workspace"></main></div>
<script>
const $=id=>document.getElementById(id), e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const settings={members:['成员','成员管理','添加成员',['姓名','邮箱','角色','团队','激活状态','在线状态'],[['林晨','lin@example.com','管理员','售后支持','已激活','在线'],['陈希','chen@example.com','客服','售后支持','已激活','离线']]],
teams:['团队','团队','新增团队',['团队名称','成员','成员数'],[['售后支持','林晨、陈希','2'],['售前咨询','周悦','1']]],
schedule:['排班','排班','新增排班',['名称','时区','服务时间','更新时间'],[['工作日排班','UTC+08:00','周一至周五 09:00–18:00','2026/11/13 09:00']]],
capacity:['容量','容量','新增规则',['规则名称','状态'],[['默认','启用']]],
queue:['队列','队列','新增队列',['名称','团队','操作'],[['售后支持','售后支持','—'],['售前咨询','售前咨询','—']]],
assign:['自动规则','自动规则','自动规则',['按以下顺序执行自动规则','执行动作','状态','最后更新时间'],[['售后工单分单','平均分配给售后支持','启用','2026/11/13 09:00']]],
survey:['满意度调查','满意度调查','新建问卷',['问卷名称','状态'],[['售后服务评价','启用']]]};
const channels=[['L','Livechat','渠道应用','智能即时聊天，轻松集成，开启全天候接待。'],['A','Amazon','电商应用','授权后，Solvea 将高效、安全、准确地服务您的客户。'],['S','Shopify','电商应用','授权后，Solvea 将高效、安全、准确地服务您的客户。'],['W','Walmart','电商应用','授权后，Solvea 将高效、安全、准确地服务您的客户。'],['Z','Zendesk','渠道应用','链接在用 Zendesk，全天在线服务客户。'],['F','Freshdesk','渠道应用','链接在用 Freshdesk，全天在线服务客户。'],['W','WhatsApp','社媒应用','管理 WhatsApp 官方账号，商业机会不再错失。'],['M','Messenger','社媒应用','管理 Messenger 官方账号，商业机会不再错失。'],['I','Instagram','社媒应用','管理 Instagram 官方账号，商业机会不再错失。'],['@','邮箱','渠道应用','链接在用邮箱，全天在线服务客户。'],['↗','API','渠道应用','API 对接 Solvea, 更灵活的AI 接入方式。'],['客','自研工单系统','渠道应用','链接在用自研工单系统，全天在线服务客户。']];
const cases={
'ticket-ai':{no:101,title:'物流状态咨询',name:'林女士',state:'AI处理中',messages:[['林女士','请问替换件寄出了吗？'],['Solvea','替换件已发出，可以在原订单查看物流进度。']]},
'ticket-human':{no:102,title:'修改配送地址',name:'周先生',state:'待处理',messages:[['周先生','下单后可以修改配送地址吗？']]},
'ticket-hitl':{no:103,title:'确认回复内容',name:'陈女士',state:'AI处理中',messages:[['陈女士','可以告知售后寄回方式吗？'],['Solvea','我来确认售后寄回指引。']]},
'survey-result':{no:102,title:'修改配送地址',name:'周先生',state:'已解决',messages:[['周先生','下单后可以修改配送地址吗？'],['林晨','已为您更新配送地址。']]}};
const demo={};for(const [k,v] of Object.entries(cases))demo[k]={state:v.state,messages:v.messages.map(x=>[...x]),review:'',assigned:false,note:false,logs:[]};
const table=(cols,rows)=>'<table><thead><tr>'+cols.map(x=>'<th>'+e(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+e(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
const link=(name,route,selected=false)=>route?'<a href="#'+route+'"'+(selected?' class="active" aria-current="page"':'')+'>'+e(name)+'</a>':'<span class="navitem">'+e(name)+'</span>';
const metric=(label,n)=>'<div class="metric">'+e(label)+'<b>'+e(n)+'</b></div>';
const nav=(label,items)=>'<aside class="subnav"><h2>'+label+'</h2>'+items+'</aside>';
const wrap=(body,wide=false)=>'<div class="content'+(wide?' wide':'')+'">'+body+'</div>';
let current='integration';
function render(){
let k=location.hash.slice(1);if(k==='routing')k='members';if(!settings[k]&&!cases[k]&&!['integration','agents','service-report','monitor'].includes(k))k='integration';current=k;
const ai=['integration','agents'].includes(k),setting=!!settings[k], report=['service-report','monitor'].includes(k);
$('sectionName').textContent=ai?(k==='agents'?'搭建 / 文本':'集成'):setting?'设置':report?'报表':'工单';
$('appnav').innerHTML='<button type="button" class="switch" aria-expanded="false" id="switch">'+(ai?'智能客服':'智能工作台')+'</button><div class="switches" id="switches" hidden>'+link('智能客服','integration')+link('智能工作台','ticket-human')+'</div>'+(ai?[['首页'],['数据分析'],['收件箱'],['预处理'],['知识中心'],['搭建', 'agents',k==='agents'],...(k==='agents'?[['　文本','agents',true],['　质检'],['　语音'],['　工具']]:[]),['批量测试'],['AI 安全'],['集成','integration',k==='integration'],['智能伙伴']]:[['工单','ticket-human',!!cases[k]],['联系人'],['报表','service-report',report],['主动触达'],['设置','assign',setting]]).map(x=>link(...x)).join('');
if(ai)$('workspace').innerHTML=wrap(k==='integration'?'<div class="channelGrid">'+channels.map(([ic,name,type,desc])=>'<article class="channel"><span class="badge">'+e(ic)+'</span><div><b>'+e(name)+'</b><small>'+e(type)+'</small></div><p>'+e(desc)+'</p></article>').join('')+'</div>':'<div class="tabs"><b>我的智能体</b></div>'+table(['名称','类型'],[['物流咨询','简单智能体']]),true);
if(setting){
const d=settings[k];const side='<h3>效率</h3>'+link('自动规则','assign',k==='assign')+link('触发器')+link('Webhook')+'<h3>工单</h3>'+link('字段与表单')+link('SLA策略')+link('队列','queue',k==='queue')+link('满意度调查','survey',k==='survey')+link('WhatsApp模板')+link('工具栏扩展')+'<h3>AI</h3>'+link('AI 打标')+'<h3>坐席配置</h3>'+['members','teams','schedule','capacity'].map(x=>link(settings[x][0],x,k===x)).join('');
$('workspace').innerHTML=nav('设置',side)+wrap('<h1>'+d[1]+'</h1>'+(k==='members'?'<div class="tabs"><b>团队成员</b>角色</div>':k==='assign'?'<div class="tabs"><b>分单</b>工单处理　留言邮箱规则</div>':'')+'<div class="toolbar"><button disabled>'+d[2]+'</button></div>'+table(d[3],d[4]));}
if(report){const side=link('总览','service-report',k==='service-report')+link('坐席与队列监控','monitor',k==='monitor');
$('workspace').innerHTML=nav('报表',side)+wrap(k==='service-report'?'<h1>报表</h1><p class="hint">统计数据中已自动剔除通知邮件和广告邮件</p><section class="block"><h2>数据概览</h2><p class="hint">数据更新时间：2026/11/13 01:00</p><div class="toolbar"><input aria-label="日期范围" value="2026-11-06　–　2026-11-12" readonly><button disabled>＋ 筛选</button></div><div class="metrics">'+metric('总工单量','10')+metric('平均回复时长(min)','6.8min')+metric('工单解决率','80%')+'</div></section><section class="block"><h2>今日工单概览</h2><div class="metrics">'+metric('AI处理中','3')+metric('待处理','2')+metric('处理中','1')+metric('已解决','4')+'</div></section><section class="block"><h2>工单/消息增长概览</h2>'+table(['','11/11','11/12'],[['工单','4','6'],['消息','9','14']])+'</section><section class="block"><h2>回复表现</h2><div class="splitbar" aria-label="Solvea 70%，人工客服 30%"><i></i></div>Solvea 70%　人工客服 30%</section><section class="block"><h2>绩效报表</h2>'+table(['客服','已解决工单量'],[['林晨','3'],['陈希','2']])+'</section>':'<h1>坐席与队列监控</h1><div class="block metrics">'+metric('排队工单数','3')+metric('超时工单数','1')+metric('可分配坐席','2')+'</div><section class="block"><h2>队列监控</h2>'+table(['队列名称','当前等待工单','超时工单数','状态'],[['售后支持','3','1','启用']])+'</section><section class="block"><h2>坐席接待能力</h2>'+table(['坐席','可接待状态'],[['林晨','可接待'],['陈希','可接待']])+'</section>');}
if(cases[k])renderTicket(k);
}
function renderTicket(k){
const c=cases[k],s=demo[k],ai=s.state==='AI处理中', hitl=k==='ticket-hitl', evaluated=k==='survey-result';
const views=[['全部','ticket-human'],['AI处理中','ticket-ai'],['人工介入','ticket-hitl'],['待处理','ticket-human'],['处理中'],['已解决','survey-result'],['通知邮件'],['广告邮件'],['我的工单'],['发送失败']];
const active=hitl?2:k==='ticket-ai'?1:evaluated?5:3;
const opts='<h3>个人视图</h3>'+link('AI转人工给我的单')+'<h3>公共视图</h3>'+link('Email')+link('Livechat');
const side=views.map(([n,h],i)=>link(n,h,i===active)).join('')+opts;
const rows=Object.entries(cases).filter(([id])=>id!=='survey-result'||evaluated).map(([id,t])=>'<a href="#'+id+'" class="'+(id===k?'active':'')+'"><small>'+e(t.name)+' · #'+t.no+'</small><b>'+e(t.title)+'</b><small>'+e(demo[id].state)+'</small></a>').join('');
const msgs=s.messages.map(([who,txt])=>'<div class="msg'+(who==='Solvea'?' ai':'')+'"><span>'+e(who)+'</span><p>'+e(txt)+'</p></div>').join('');
const review=hitl?'<div class="review"><b>人机协同</b><div>请确认是否发送寄回指引。</div>'+(s.review?'<p>'+e(s.review)+'</p>':'<button data-act="agree" class="primary">同 意</button><button data-act="reject">拒 绝</button>')+'</div>':'';
const channel=hitl?'Livechat':'邮箱';
const reply=ai?'<p>该工单由 AI 处理中</p><button data-act="handoff">AI转人工</button>':'<p><button data-act="channel" aria-pressed="'+!s.note+'">'+channel+'</button> <button data-act="note" aria-pressed="'+s.note+'">备注</button>　'+e(c.name)+'</p><textarea id="replyText" placeholder="请输入" aria-label="'+(s.note?'备注':'回复')+'"></textarea><div class="actions"><button data-act="send" class="primary" disabled>发 送</button></div>';
$('workspace').innerHTML='<div class="desk">'+nav('工单',side)+'<aside class="tickets"><header><b>'+views[active][0]+'</b></header>'+rows+'</aside><section class="conversation"><header><div class="titleline"><strong>'+e(c.title)+'</strong><button disabled>事件</button>'+(ai?'<button data-act="handoff">转人工</button>':'')+'<button data-act="assign"'+(s.assigned?' disabled':'')+'>分配</button><button data-act="status" aria-expanded="false">'+e(s.state)+'</button></div><div class="ticketmeta"># '+c.no+'　'+(ai?'Solvea.cx':s.assigned?'林晨':'')+'　标签　更多</div><div id="options" hidden></div></header><div class="thread">'+msgs+review+'</div><div class="reply">'+reply+'</div></section><aside class="detail"><header><b>详情</b></header><section><h3>电商信息</h3><p>订单</p></section><section><h3>客户信息</h3><strong>'+e(c.name)+'</strong><p>客户标签</p><p>备注</p></section><section><h3>满意度</h3><p>状态　<strong>'+(evaluated?'已提交':'未生成')+'</strong></p>'+(evaluated?'<p>客服态度好么　<strong>10 / 10</strong></p>':'')+'</section><section><h3>操作记录</h3><p>新建工单</p>'+s.logs.map(x=>'<p>'+e(x)+'</p>').join('')+'</section></aside></div>';
const field=$('replyText');if(field)field.addEventListener('input',()=>{document.querySelector('[data-act="send"]').disabled=!field.value.trim()});
}
document.addEventListener('click',ev=>{
const b=ev.target.closest('button');if(!b)return;
if(b.id==='switch'){const x=$('switches');x.hidden=!x.hidden;b.setAttribute('aria-expanded',String(!x.hidden));return}
const s=demo[current],act=b.dataset.act;if(!s||!act)return;
if(act==='status'||act==='assign'){const x=$('options');x.hidden=!x.hidden;b.setAttribute('aria-expanded',String(!x.hidden));x.innerHTML=act==='status'?'<button data-act="progress">处理中</button> <button data-act="closeTicket">已解决</button>':'<button data-act="assignAgent">林晨</button>';return;}
if(act==='progress'||act==='closeTicket'){s.state=act==='progress'?'处理中':'已解决';s.logs.push('工单状态变更为 '+s.state);}
if(act==='assignAgent'){s.assigned=true;s.logs.push('分配给 林晨');}
if(act==='handoff'){s.state='待处理';s.logs.push('AI 转人工客服');if(current==='ticket-hitl')s.review='已转人工，审核已结束';}
if(act==='agree'){s.review='已同意';s.logs.push('同意了人机协同请求');}
if(act==='reject'){s.review='已拒绝';s.logs.push('拒绝了人机协同请求');}
if(act==='channel'||act==='note')s.note=act==='note';
if(act==='send'){const val=$('replyText')?.value.trim();if(!val)return;s.messages.push([s.note?'林晨 · 备注':'林晨',val]);s.logs.push(s.note?'添加备注':'已提交回复');}
renderTicket(current);
});
window.addEventListener('hashchange',()=>{render();if(parent!==window&&location.protocol!=='file:')parent.postMessage({type:'solvea-preview-route',id:current},location.origin)});render();
</script></body></html>
